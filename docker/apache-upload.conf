# SquirrelStock: папка загруженных файлов. upload/ — том Docker: файлов образа (в том числе upload/.htaccess) в нем может
# не быть, а восстановление из копии пишет в него файлы. Поэтому правила — здесь, .htaccess папки не читается.
<Directory /var/www/html/upload>
    AllowOverride None
    Require all denied
    <FilesMatch "(?i)\.(jpe?g|png|gif|webp)$">
        Require all granted
    </FilesMatch>
    <FilesMatch "(?i)\.(php\d*|pht|phtml|phar|cgi|pl|py|sh|shtml)\.">
        Require all denied
    </FilesMatch>
    <IfModule php_module>
        php_admin_flag engine off
    </IfModule>
</Directory>
