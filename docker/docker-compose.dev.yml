# Режим разработки: код из www/ монтируется в контейнер, правки видны без пересборки образа.
# docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
services:
  web:
    volumes:
      - ../www/app:/var/www/html/app
      - ../www/templates:/var/www/html/templates
      - ../www/assets:/var/www/html/assets
      - ../www/lang:/var/www/html/lang
      - ../www/cli:/var/www/html/cli
      - ../www/init.php:/var/www/html/init.php
      - ../www/index.php:/var/www/html/index.php
      - ../www/.htaccess:/var/www/html/.htaccess
      - ../www/loadfile.php:/var/www/html/loadfile.php
      - ../www/loadimage.php:/var/www/html/loadimage.php
      - ../www/loadshopimage.php:/var/www/html/loadshopimage.php
