<html>
    <head>
            <title> {{#t}}reference.storelist.dovidnyk_skladiv{{/t}} </title>

    </head>

    <body>


        <div class="row" zippy="storetable">
            <div class="col-12 col-md-6  col-xl-5">
                <h2>{{#t}}reference.storelist.dovidnyk_skladiv{{/t}}</h2>
                  <a zippy="storeadd" class="btn btn-primary  ">{{#t}}common.dodaty{{/t}}</a>
                <table class="table table-bordered  table-sm">
                    <tr>
                        <th>{{#t}}common.nazva{{/t}}</th>
                        {{#usebranch}}
                        <th>{{#t}}common.filiia{{/t}}</th>
                        {{/usebranch}}
                        <th class="text-end">{{#t}}reference.storelist.tmts_na_sumu{{/t}}</th>
                        <th>{{#t}}common.opys{{/t}}</th>
                        <th style="width: 80px"></th>
                    </tr>
                    <tr zippy="storelist">
                        <td zippy="storename"></td>
                        {{#usebranch}}
                        <td zippy="branch"></td>
                        {{/usebranch}}
                        <td zippy="qty" class="text-end"></td>
 
                        <td zippy="storedesc"></td>
                        <td align="center">
                            <a zippy="storeedit" title="{{#t}}common.redahuvaty{{/t}}"><i class="fa fa-edit"></i></a>
                        &nbsp;&nbsp;    <a zippy="storedelete" title="{{#t}}common.vyluchyty{{/t}}"><i class="fa fa-trash"></i></a></td>
                    </tr>
                </table>


            </div>
        </div>
        <div class="row">
            <form class="col-12 col-md-4" zippy="storeform" method="post">


                <div class="mb-2">
                    <label for="storeeditname"> {{#t}}common.nazva{{/t}}</label>
                    <input autofocus="on"   class="form-control" type="text" zippy="storeeditname"  required="on" >
                </div>
                {{#usebranch}}
                <div class="mb-2">
                    <label for="editbranch">{{#t}}common.filiia{{/t}}</label>
                    <select class="form-control" zippy="editbranch">
                        <option value="0">{{#t}}common.ne_obrano{{/t}}</option>
                    </select>
                </div>
                {{/usebranch}}
                <div class="mb-2">
                    <label for="storeeditdesc"> {{#t}}common.opys{{/t}} </label>
                    <textarea class="form-control" type="text" zippy="storeeditdesc"></textarea>
                </div>
                <div class="form-check">
                    <input zippy="editdisabled" type="checkbox" class="form-check-input">
                    <label class="form-check-label" for="editdisabled">{{#t}}common.ne_vykorystovuietsia{{/t}}</label>
                </div>                
                <div class="mb-2">
                    <input zippy="storecancel" type="button" value="{{#t}}common.skasuvaty{{/t}}" class="btn btn-secondary me-2">
                    <input zippy="storesave" type="submit" value="{{#t}}common.zberehty{{/t}}" class="btn btn-primary  "> 
                    
                </div>


            </form>
        </div>


    </body>
</html>
