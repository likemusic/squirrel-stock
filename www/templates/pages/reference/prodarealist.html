<html>
    <head>
           <title> {{#t}}reference.prodarealist.vyrobnychi_dilnytsi{{/t}} </title>
   </head>

    <body>
        <div class="row">
           
                <div zippy="patable" class="col-12 col-md-8 col-xl-6">
                    <h3>{{#t}}reference.prodarealist.vyrobnychi_dilnytsi{{/t}} </h3>
                    <a zippy="addnew" class="btn btn-primary  ">{{#t}}common.dodaty{{/t}}</a>
                    <table class="table table-bordered   table-sm"  >
                     
                        <tr zippy="palist">
                            <td zippy="pa_name"></td>
                            <td zippy="pa_notes"></td>


                            <td style="width:75px"><a zippy="edit" title="{{#t}}common.redahuvaty{{/t}}"><i class="fa fa-edit"></i></a> <a
                                    zippy="delete" title="{{#t}}common.vydalyty{{/t}}"><i class="fa fa-trash"></i></a></td>
                        </tr>
                    </table>


                </div>

                <form class="col-6 col-md-4" zippy="padetail">
                    <div class="mb-2">
                        <label for="editpa_name">{{#t}}common.nazva{{/t}}</label>
                        <input autofocus="on"    required="on"  class="form-control" zippy="editpa_name"/>
                    </div>
               {{#usebranch}}
                <div class="mb-2">
                    <label for="editbranch">{{#t}}common.filiia{{/t}}</label>
                    <select class="form-select" zippy="editbranch">
                        <option value="0">{{#t}}common.ne_obrano{{/t}}</option>
                    </select>
                </div>
                {{/usebranch}}                    
                  <div class="mb-2">
                        <label for="editpa_notes">{{#t}}common.prymitka{{/t}}</label>
                        <input      class="form-control" zippy="editpa_notes"/>
                    </div>
                 <div class="form-check">
                    <input zippy="editdisabled" type="checkbox" class="form-check-input">
                    <label class="form-check-label" for="editdisabled">{{#t}}common.ne_vykorystovuietsia{{/t}}</label>
                </div>                    
                    <div class="mb-2">

                      <input zippy="cancel" type="button" value="{{#t}}common.skasuvaty{{/t}}" class="btn btn-secondary me-2  ">
                      <input zippy="save" type="submit" value="{{#t}}common.zberehty{{/t}}" class="btn btn-primary  ">
                   </div>

                </form>
             
        </div>
           <script>               
         function check_delete() {
                return confirm("Видалити?")
            }
        </script>     
    </body>
</html>
