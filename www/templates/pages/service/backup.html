<html>
    <head>
        <title>{{#t}}service.backup.title{{/t}}</title>
    </head>
    <body>
        <div class="row">
            <div class="col-12 col-md-8 col-xl-6">
                <h3>{{#t}}service.backup.title{{/t}}</h3>
                <p class="text-muted">{{#t}}service.backup.help{{/t}}</p>
                <form zippy="bform">
                    <input zippy="create" type="submit" class="btn btn-primary" value="{{#t}}service.backup.create{{/t}}">
                </form>
                <h4 class="mt-4">{{#t}}service.backup.restore_title{{/t}}</h4>
                <form zippy="rform" enctype="multipart/form-data">
                    <div class="mb-2">
                        <input type="file" zippy="rfile" class="form-control" accept=".zip,.sql">
                    </div>
                    <div class="form-check mb-2">
                        <input zippy="confirm" type="checkbox" class="form-check-input">
                        <label class="form-check-label" for="confirm">{{#t}}service.backup.confirm{{/t}}</label>
                    </div>
                    <input zippy="restore" type="submit" class="btn btn-danger" value="{{#t}}service.backup.restore{{/t}}">
                </form>
            </div>
        </div>
    </body>
</html>
