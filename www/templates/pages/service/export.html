<html>
     <head>
        <title> {{#t}}common.eksport{{/t}}    </title>

    </head>

    <body>
        <div class="row">
            <div class="col-12 col-md-6 col-xl-4 card">
                <h3>{{#t}}service.export.eksport_dokumentiv{{/t}}</h3>
                <form zippy="dform" class="row">
                    <div class="col-10">
                        <div class="mb-2 row">
                            <label for="dtype" class="col-sm-4 form-label">{{#t}}service.export.typ_eksportu{{/t}}</label>
                            <div class="col-sm-8">
                                <select zippy="dtype" class="form-control   ">
                                </select>
                            </div>
                        </div>
                        <div class="mb-2 row">
                            <label for="dfrom" class="col-sm-4 form-label">{{#t}}common.z{{/t}}</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control ms-sm-2  " zippy="dfrom" style="width:110px">

                            </div>
                        </div>
                        <div class="mb-2 row">
                            <label for="dto" class="col-sm-4 form-label">{{#t}}common.po_2{{/t}}</label>
                            <div class="col-sm-8">
                                <input type="text" class="form-control ms-sm-2  " zippy="dto" style="width:110px">

                            </div>
                        </div>


                        <div class="mb-2">
                            <input class="btn btn-info" type="submit" value="{{#t}}common.perehliad{{/t}}"/>
                        </div>

                    </div>
                </form>
                <form zippy="dformlist" class="row">
                    <div class="col-12">
                        <table class="table table-sm table-hover">
                            <tr>
                                <th><input type="checkbox" id="dchall" onchange="chclick()"></th>
                                <th>{{#t}}common.nomer{{/t}}</th>
                                <th>{{#t}}common.data{{/t}}</th>
                                <th>{{#t}}common.kontrahent{{/t}}</th>
                                <th class="text-end">{{#t}}common.suma{{/t}}</th>
                            </tr>
                            <tr zippy="doclist">
                                <td><input type="checkbox" zippy="dch" class="dchc"></td>
                                <td zippy="dnumber"></td>
                                <td zippy="ddate" class="text-nowrap "></td>
                                <td zippy="dcustomer"></td>
                                <td zippy="damount" class="text-end"></td>

                            </tr>

                        </table>
                       <div class="form-check">

                            <input   class="form-check-input" type="checkbox" zippy="docxml">
                            <label class="form-check-label me-3" for="docxml">{{#t}}report.finreportsmall.eksport_u_xml{{/t}}</label>
                        </div>

                        
                        <div class="mb-2">
                            <input class="btn btn-info" type="submit" value="{{#t}}common.eksport{{/t}}"/>
                        </div>
                    </div>

                </form>
            </div>
            <div class="col-12 col-md-6 col-xl-4 card">
                <h3>{{#t}}service.export.eksport_nomenklatury{{/t}}</h3>


                <form zippy="iform" class="row">
                    <div class="col-10">

                        <div class="mb-2">
                            <label for="itype">{{#t}}service.export.typ_eksportu{{/t}}</label>
                            <select zippy="itype" class="form-control   ">
                                <option value="0">{{#t}}service.export.tilky_dovidnyk{{/t}}</option>
                                <option value="1">{{#t}}service.export.dani_skladu{{/t}}</option>
                            </select>
                        </div>
                        <div class="mb-2">
                            <label for="item_type">{{#t}}reference.itemlist.typ_tmts{{/t}}</label>
                            <select zippy="item_type" class="form-control   ">
                                <option value="0">{{#t}}common.vsi{{/t}}</option>
                            </select>
                        </div>
                        <div class="mb-2">
                            <label for="cat">{{#t}}common.katehoriia{{/t}}</label>
                            <select zippy="cat" class="form-control   ">
                                     <option value="0">{{#t}}common.ne_vkazano{{/t}}</option>
                           </select>
                        </div>
                        <div class="mb-2">
                            <label for="brand" >{{#t}}common.brend{{/t}}</label>
                            <input zippy="brand" class="form-control   ">
                            
                        </div>
                        <div class="mb-2">
                            <label data-label="store" for="store">{{#t}}common.sklad{{/t}}</label>
                            <select zippy="store" class="form-control   ">
                            </select>
                        </div>
                       <div class="form-check">

                            <input   class="form-check-input" type="checkbox" zippy="itemxml">
                            <label class="form-check-label me-3" for="itemxml">{{#t}}report.finreportsmall.eksport_u_xml{{/t}}</label>
                        </div>


                        <div class="mb-2">
                            <input class="btn btn-info" type="submit" value="{{#t}}common.eksport{{/t}}"/>
                        </div>
                    </div>


                </form>
            </div>
            <div class="col-12 col-md-6 col-xl-4  card">
                <h3>{{#t}}service.export.eksport_kontrahentiv{{/t}}</h3>

                <form zippy="cform" class="row">
                    <div class="col-10  ">

                        <div class="mb-2">
                            <label for="ctype">{{#t}}common.typ{{/t}} </label>
                            <select zippy="ctype" class="form-control ">
                                <option value="0">{{#t}}common.vsi{{/t}}</option>
                                <option value="1">{{#t}}common.pokuptsi{{/t}}</option>
                                <option value="2">{{#t}}common.postachalnyky{{/t}}</option>
                            </select>
                        </div>

                         <div class="form-check">

                            <input   class="form-check-input" type="checkbox" zippy="custxml">
                            <label class="form-check-label me-3" for="custxml">{{#t}}report.finreportsmall.eksport_u_xml{{/t}}</label>
                        </div>

                        <div class="mb-2">
                            <input class="btn btn-info" type="submit" value="{{#t}}common.eksport{{/t}}"/>
                        </div>
                    </div>


                </form>  
             
            </div>
        </div>


        <script>
            function chclick() {
                var ch = $("#dchall").prop('checked');
                $('.dchc').prop('checked', ch)
            }


        </script>
    </body>
</html>
