<html>

    <head>
        <title>  {{#t}}print.toc.obmezhennia_systemy{{/t}}  </title>

    </head>

    <body>
        <div class="row">
            <div class="col-12 col-md-11  col-xl-9">
                <h3>{{#t}}print.toc.obmezhennia_systemy{{/t}}</h3>
                 <small>
                   {{#t}}report.toc.u_zviti_pokazano_mozhlyvi_vuzki{{/t}}
                 </small>


               
                <div class="navbar">

                    <form zippy="filter"  >
                       <div class="row  ">
                        <label class="col-form-label col-auto" for="period">{{#t}}report.toc.period{{/t}} </label>
                         <div class="col-auto  ">
                            <select class="form-control me-2" zippy="period">
                                <option value="1">{{#t}}report.toc.1_misiats{{/t}}</option>
                                <option value="2">{{#t}}report.toc.2_misiatsi{{/t}}</option>
                                <option value="3">{{#t}}app.main.3_misiatsi{{/t}}</option>
                                <option value="3">{{#t}}app.main.6_misiatsiv{{/t}}</option>
                             </select>
                          </div>
                          <div class="col-auto  ">
                          <input  zippy="onreport" class="btn btn-primary  " type="submit" value="{{#t}}common.ok{{/t}}">
                        </div>
                      </div>
                    </form>

                </div>

                <div zippy="detail">
                  
                    <div class="mt-2">

                        <a style="cursor:pointer" onclick=" $('#preview').printThis();" title="{{#t}}common.druk{{/t}}"><i class="fa fa-print me-2"></i></a>
                        <a href="/index.php?p=App/Pages/ShowReport&arg=xls/predsell" target="_blank" title="{{#t}}common.eksport_v_excel{{/t}}"><i class="fa fa-file-excel me-2"></i></a>
                        <a href="/index.php?p=App/Pages/ShowReport&arg=pdf/predsell" target="_blank" title="{{#t}}common.eksport_v_pdf{{/t}}"><i class="fa fa-file-pdf me-2"></i></a>

                    </div>

                    <div class="table-responsive-lg  mt-2" zippy="preview"  >
                    </div>

                </div>
            </div>
        </div>
        
 
        
    </body>

</html>
