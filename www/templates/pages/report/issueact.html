<html>
    <head>
        <title>{{#t}}report.issueact.title{{/t}}</title>
    </head>
    <body>
        <div class="row">
            <div class="col-12">
                <h3>{{#t}}report.issueact.title{{/t}}</h3>
                <p class="text-muted" id="issueact-names1c">{{#t}}report.issueact.names1c{{/t}}</p>
                <div class="navbar">
                    <form zippy="filter">
                        <div class="row g-2 align-items-end">
                            <div class="col-auto">
                                <label class="form-label" for="year">{{#t}}common.rik{{/t}}</label>
                                <select zippy="year" class="form-select"></select>
                            </div>
                            <div class="col-auto">
                                <label class="form-label" for="month">{{#t}}common.misiats{{/t}}</label>
                                <select zippy="month" class="form-select"></select>
                            </div>
                            <div class="col-auto">
                                <label class="form-label" for="cat">{{#t}}common.katehoriia{{/t}}</label>
                                <select zippy="cat" class="form-select"></select>
                            </div>
                            <div class="col-auto">
                                <label class="form-label" for="title">{{#t}}common.zaholovok{{/t}}</label>
                                <input zippy="title" class="form-control" type="text">
                            </div>
                            <div class="col-auto form-check mb-2 ms-2">
                                <input zippy="allitems" class="form-check-input" type="checkbox">
                                <label class="form-check-label" for="allitems">{{#t}}report.issueact.all_items{{/t}}</label>
                            </div>
                            <div class="col-auto">
                                <input zippy="onreport" class="btn btn-primary" type="submit" value="{{#t}}common.ok{{/t}}">
                            </div>
                        </div>
                    </form>
                </div>
                <div zippy="detail">
                    <div>
                        <a style="cursor:pointer" onclick=" $('#preview').printThis();" title="{{#t}}common.druk{{/t}}"><i class="fa fa-print me-2"></i></a>
                        <a href="/index.php?p=App/Pages/ShowReport&arg=xls/issueact" target="_blank" title="{{#t}}common.eksport_v_excel{{/t}}"><i class="fa fa-file-excel me-2"></i></a>
                    </div>
                    <div class="table-responsive mt-2" zippy="preview">
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
