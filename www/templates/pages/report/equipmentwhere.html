<html>
    <head>
        <title>{{#t}}report.equipmentwhere.title{{/t}}</title>
    </head>
    <body>
        <div class="row">
            <div class="col-12">
                <h3>{{#t}}report.equipmentwhere.title{{/t}}</h3>
                <div class="navbar">
                    <form zippy="filter">
                        <div class="row g-2 align-items-end">
                            <div class="col-auto">
                                <label class="form-label" for="searchtext">{{#t}}common.poshuk{{/t}}</label>
                                <input zippy="searchtext" class="form-control" type="text" placeholder="{{#t}}report.equipmentwhere.search_ph{{/t}}">
                            </div>
                            <div class="col-auto">
                                <label class="form-label" for="cat">{{#t}}common.katehoriia{{/t}}</label>
                                <select zippy="cat" class="form-select"></select>
                            </div>
                            <div class="col-auto">
                                <label class="form-label" for="state">{{#t}}common.stan{{/t}}</label>
                                <select zippy="state" class="form-select"></select>
                            </div>
                            <div class="col-auto">
                                <input zippy="onreport" class="btn btn-primary" type="submit" value="{{#t}}common.ok{{/t}}">
                            </div>
                        </div>
                    </form>
                </div>
                <div zippy="detail">
                    <div>
                        <a style="cursor:pointer" onclick=" $('#preview').printThis();" title="{{#t}}common.druk{{/t}}"><i class="fa fa-print me-2"></i></a>
                        <a href="/index.php?p=App/Pages/ShowReport&arg=xls/equipmentwhere" target="_blank" title="{{#t}}common.eksport_v_excel{{/t}}"><i class="fa fa-file-excel me-2"></i></a>
                    </div>
                    <div class="table-responsive mt-2" zippy="preview">
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
