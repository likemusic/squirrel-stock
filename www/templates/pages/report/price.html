<html>
   <head>
        <title>  {{#t}}report.price.prais{{/t}}  </title>

    </head>
    <body>
        <div class="row">
            <div class="col-12   ">
                <h3>{{#t}}report.price.prais{{/t}}</h3>
                <div class="navbar">
                    <form zippy="filter"  >
                      <div class="row  ">
                        <div class="col-auto  pt-2"> 
                        <div class="form-check    ">
                            <input class="form-check-input" type="checkbox" zippy="showqty">
                            <label class="form-check-label" for="showqty"> {{#t}}common.kil{{/t}}     </label>
                        </div>
                        </div>
                         <div class="col-auto  pt-2 ">
                        <div class="form-check    ">
                            <input class="form-check-input" type="checkbox" zippy="showdesc">
                            <label class="form-check-label" for="showdesc"> {{#t}}common.opys{{/t}}
                            </label>
                        </div>
                        </div>
                          {{#useimages}}
                           <div class="col-auto  pt-2 ">
                         <div class="form-check   ">
                            <input class="form-check-input" type="checkbox" zippy="showimage">
                            <label class="form-check-label" for="showimage"> {{#t}}report.price.foto{{/t}}
                            </label>
                        </div>
                        </div>
                          {{/useimages}}
                        <label class="col-form-label col-auto"  ><b>{{#t}}report.price.tsiny{{/t}}</b></label>
                        <div class="col-auto  pt-2 ">
                         <div class="form-check    ">
                           <input class="form-check-input" type="checkbox" zippy="price1">
                            <label class="form-check-label" for="price1">
                                {{price1name}}
                            </label>
                          </div>
                         </div>
                         <div class="col-auto  pt-2 ">
                            <div class="form-check   ">
                                <input class="form-check-input" type="checkbox" zippy="price2">
                                <label class="form-check-label" for="price2">
                                    {{price2name}}
                                </label>
                            </div>
                        </div>
                         <div class="col-auto   pt-2">
                            <div class="form-check   ">
                                <input class="form-check-input" type="checkbox" zippy="price3">
                                <label class="form-check-label" for="price3">
                                    {{price3name}}
                                </label>
                            </div>
                        </div>
                         <div class="col-auto  pt-2 ">
                        <div class="form-check    ">
                            <input class="form-check-input" type="checkbox" zippy="price4">
                            <label class="form-check-label" for="price4">
                                {{price4name}}
                            </label>
                        </div>
                        </div>
                         <div class="col-auto  pt-2 ">
                        <div class="form-check   ">
                            <input class="form-check-input" type="checkbox" zippy="price5">
                            <label class="form-check-label" for="price5">
                                {{price5name}}
                            </label>
                        </div>
                        </div>
                         <div class="col-auto  pt-2 ">
                        <div class="form-check   ">

                            <input class="form-check-input" type="checkbox" zippy="onstore">
                            <label class="form-check-label me-2" for="onstore">{{#t}}report.price.tilky_v_naiavnosti{{/t}}</label>
                        </div>
                         </div>
                           <label  class="col-form-label col-auto"   for="searchcat">{{#t}}common.katehoriia_2{{/t}}</label>
                          <div class="col-auto  ">
                                <select class="form-control  " zippy="searchcat">
                                    <option value="0">{{#t}}common.ne_vkazano{{/t}}</option>
                                </select>
                             </div>    
                             <label   class="col-form-label col-auto"  for="searchbrand">{{#t}}common.brend{{/t}} </label>
                             <div class="col-auto  ">
                               <input autocomplete="off"   class="form-control me-2" zippy="searchbrand"/>
                            </div>
                        <div class="col-auto  ">
                         <input  zippy="onreport" class="btn btn-primary  " type="submit" value="{{#t}}common.ok{{/t}}">
                       </div>
                      </div>
                    </form>
                </div>


                <div zippy="detail">
                    <div>
                      <a style="cursor:pointer" onclick=" $('#preview').printThis();" title="{{#t}}common.druk{{/t}}"><i class="fa fa-print me-2"></i></a>
                         {{^showimage}}
                        <a href="/index.php?p=App/Pages/ShowReport&arg=xls/price" target="_blank" title="{{#t}}common.eksport_v_excel{{/t}}"><i class="fa fa-file-excel me-2"></i></a>
                         {{/showimage}}
                        <a href="/index.php?p=App/Pages/ShowReport&arg=pdf/price" target="_blank" title="{{#t}}common.eksport_v_pdf{{/t}}"><i class="fa fa-file-pdf me-2"></i> </a>

                    </div>

                    <div  class="table-responsive-lg mt-2" zippy="preview"  >
                    </div>

                </div>
            </div>
        </div>
    </body>
</html>
