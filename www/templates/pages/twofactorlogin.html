<html  lang="uk">
 

    <head>

        <title>{{appname}}</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="robots" content="noindex">     
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" lang="uk">
        <script src="/assets/js/sqs-theme.js?v=1"></script>   <!-- SquirrelStock: тема последнего входа с этого компьютера, без нее — как в системе -->
      
        <link rel="stylesheet" href="/assets/css/bootstrap.css?v=826">
        <link rel="stylesheet" href="/vendor/leon-mbs/zippy/assets/css/zippy-bundle.css?v=825">
        <link rel="stylesheet" href="/assets/css/app.css?v=825">


        <script src="/vendor/leon-mbs/zippy/assets/js/jquery.js" type="text/javascript"></script>
        <script src="/vendor/leon-mbs/zippy/assets/js/bootstrap.bundle.js?v=825" type="text/javascript"></script>
        <script src="/vendor/leon-mbs/zippy/assets/js/zippy-bundle-ua.js?v=825" type="text/javascript"></script>
        <script src="/assets/js/bootstrap.bundle.js?v=825" type="text/javascript"></script>
         <script src="/assets/js/app.js?v=825" type="text/javascript"></script>
       

    </head>

    <body class="  login-page    " >
        <div class="row justify-content-center mt-2 mb-1">
            <div class="col-12   ">

                {{#alerterror}}
                <div class="alert alert-danger" role="alert">
                    {{{alerterror}}}
                </div>
                {{/alerterror}}

            </div>
        </div>
        <div class="login-box">

            <h3>{{appname}}</h3>
            <div class="card">
                <div class="card-body login-card-body">
                    <form zippy="codeform">
                        <div class="mb-2">
                            <label class="form-label" for="code">{{#t}}sqs.2fa.login_code{{/t}}</label>
                            <input autofocus="on" zippy="code" required="on" class="form-control" autocomplete="one-time-code" inputmode="text">
                            <small class="text-muted">{{#t}}sqs.2fa.login_help{{/t}}</small>
                        </div>
                        <div class="d-flex justify-content-between align-items-center">
                            <a href="/index.php?p=App/Pages/UserLogin">{{#t}}sqs.2fa.login_back{{/t}}</a>
                            <button type="submit" class="btn btn-primary">{{#t}}sqs.2fa.login_submit{{/t}}</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
