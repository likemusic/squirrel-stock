<html>
   <head>
          <title> {{#t}}common.vyplata_zarplaty{{/t}}</title>
    </head>
    <body>


        <form zippy="docform">
            <h3> {{#t}}common.vyplata_zarplaty{{/t}}</h3>
            <div class="row">
                <div class="col-12 col-md-4 col-xl-3">
                    <div class="mb-2">
                        <label for="document_number">{{#t}}common.nomer_dokumenta{{/t}}</label>
                        <input class="form-control" type="text" zippy="document_number">
                    </div>
                    <div class="mb-2">
                        <label for="document_date"> {{#t}}common.data{{/t}}</label>
                        <input class="form-control" type="text" zippy="document_date"  required="on" >
                    </div>
                    <div class="form-check">
                         <input zippy="advance" type="checkbox" class="form-check-input">
                         <label class="form-check-label" for="advance">{{#t}}doc.outsalary.vyplata_avansu{{/t}}</label>
                    </div>
              

                    <div class="mb-2">
                        <label for="notes">{{#t}}common.prymitka{{/t}} </label>

                        <input class="form-control" type="text" zippy="notes">

                    </div>

                </div>
                <div class="col-12 col-md-4 col-xl-3">
                    <div class="mb-2">
                        <label for="payment">{{#t}}doc.outcomemoney.z_kasy_rakhunku{{/t}} </label>
                        <select class="form-control" zippy="payment">
                        </select>
                    </div>
                    <div class="mb-2">
                        <label for="year">{{#t}}common.rik{{/t}}</label>
                        <select class="form-control" zippy="year">
                        </select>
                    </div>
                    <div class="mb-2">
                        <label for="month">{{#t}}common.misiats{{/t}}</label>
                        <select class="form-control" zippy="month">
                        </select>
                    </div>

                </div>
            </div>
            <div class="row">
                <div class="col-12 col-md-6">
                    <input type="button" value="{{#t}}common.skasuvaty{{/t}}" zippy="backtolist" class="btn   btn-secondary  me-2">
                     <input zippy="tolist" type="submit" value="{{#t}}doc.calcsalary.dali{{/t}} " class="btn   btn-primary">
           
                </div>
            </div>


        </form>     
  
    <form zippy="listform">
         <div class="row">
                <div class="col-12 col-md-8 col-xl-6">
               
            <div class="mb-2 row">
                <div class="col-auto pt-2">
                  <label   > {{#t}}common.spivrobitnyk{{/t}}</label>
                </div>
               <div class="col-auto">
                  <select class="form-control"  zippy="newemp" >
                     <option value="0">{{#t}}common.ne_obrano{{/t}}</option>
                        </select>
                </div>
               <div class="col-auto pt-2">
                     <a zippy="addemp" class="btn btn-info btn-sm  " >{{#t}}common.dodaty{{/t}}</a>
                </div>
                
                
                
            </div>

             <table class="table table-sm">
                   <tr>
                    <th style="width:20px"><i onclick=" $('.seldel').prop('checked', $('.seldel').prop('checked') == false);"
                                style=";cursor:pointer" title="{{#t}}common.zniaty_vystavyty_praporets{{/t}}"
                                    class="fa fa-check-double "></i></th>
                      <th>{{#t}}common.p_i_b{{/t}}</th>
                                  
                      <th  >{{#t}}common.suma{{/t}}</th>
                    
                   </tr>
                  <tr zippy="elist">
                      <td   >
                       <input tabindex="-1" class="seldel" type="checkbox" zippy="emp_ch">
                      </td>
                      <td zippy="emp_name"></td>
                                
                    
                      <td  ><input onblur="calcTotal()" class="form-control salsum" zippy="amount" style="width:100px;"   ></td>
                            
                          
                  </tr>
                      <tr>
                       
                                     
                      <th><a zippy="edel" title="{{#t}}common.vydalyty{{/t}}" ><i class="fa fa-trash text-danger" ></i></a>                  </th>
                      <th class="text-end">{{#t}}common.vsoho{{/t}}</th>
                      <th zippy="total"> </th>
                    
                   </tr>    
        </table>
             
             
             <div class="col-11 col-md-7 col-xl-5 mt-4 d-flex justify-content-end pt-4">
                    <input type="submit" value="{{#t}}common.nazad{{/t}}" zippy="todoc" class="btn   btn-secondary   ms-2">
                     <input zippy="savedoc" type="submit" value="{{#t}}common.zberehty{{/t}}" class="btn   btn-info   ms-2">
                    <input zippy="execdoc" type="submit" value="{{#t}}common.provesty{{/t}}" class="btn btn-success  ms-2 ">

             </div>
         </div> </div>
        </form>
    
        <script>

            function calcTotal() {
                var total = 0;

                $('.salsum').each(function (index, value) {
                    var a = $(this).val();
                    a = parseVal(a);
                    total = total + a;



                });

                $('#total').text(total)
            }
            
            calcTotal() ;
        </script>

    </body>

</html>
