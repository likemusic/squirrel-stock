<html>
    <head>
          <title> {{#t}}doc.eq.operatsii_z_oz_ta_nma{{/t}}</title>
    </head>
    <body>


        <form zippy="docform">
            <h3> {{#t}}doc.eq.operatsii_z_oz_ta_nma{{/t}}</h3>
            <div class="row">
                <div class="col-12 col-md-4 col-xl-3">
                    <div class="mb-2">
                        <label for="document_number">{{#t}}common.nomer_dokumentu{{/t}}</label>
                        <input class="form-control" type="text" zippy="document_number">
                    </div>
                    <div class="mb-2">
                        <label for="document_date"> {{#t}}common.data{{/t}}</label>
                        <input class="form-control" type="text" zippy="document_date"  required="on" >
                    </div>
                     <div class="mb-2">
                        <label for="optype">{{#t}}common.typ_operatsii{{/t}}</label>
                        <select class="form-control" zippy="optype">
                               <option value="0">{{#t}}common.ne_vybrano{{/t}}</option>
                           
                    
                        </select>
                        <small zippy="tip"></small>
                    </div>                    
                     <div class="mb-2">
                        <label for="eq"> {{#t}}doc.eq.oz{{/t}}</label>
                        <input placeholder="{{#t}}common.pochnit_vvodyty_3{{/t}}" class="form-control" type="text" zippy="eq"    >
                    </div>

             
                  
                      

                </div>
           
                 <div class="col-12 col-md-4 col-xl-3">
               
                     <div class="mb-2">
                        <label data-label="parea" for="parea">{{#t}}common.vyrobnycha_dilianka{{/t}}</label>
                        <select class="form-control" zippy="parea">
                            <option value="0">{{#t}}common.ne_vybrano{{/t}}</option>
                        </select>
                    </div>
                  
                     <div class="mb-2">
                        <label data-label="emp" for="emp">{{#t}}common.vidpovidalnyi{{/t}}</label>
                        <select class="form-control" zippy="emp">
                            <option value="0">{{#t}}common.ne_vybrano{{/t}}</option>
                        </select>
                    </div>
                    <div class="mb-2">
                        <label data-label="customer" for="customer">{{#t}}common.kontrahent{{/t}}</label>
                        <input placeholder="{{#t}}common.pochnit_vvodyty_3{{/t}}"   class="form-control  " type="text" zippy="customer">
                   
                    </div>
                    <div class="mb-2">
                        <label data-label="store" for="store">{{#t}}common.sklad{{/t}}</label>
                        <select class="form-control" zippy="store">
                        </select>
                    </div>
                  
                    <div class="mb-2">
                        <label data-label="item" for="item">{{#t}}common.tmts{{/t}}</label>
                        <input placeholder="{{#t}}common.pochnit_vvodyty_3{{/t}}"   class="form-control  " type="text" zippy="item">
                   
                    </div>
                     <div class="mb-2">
                        <label data-label="amount" for="amount">{{#t}}common.suma{{/t}}</label>
                        <input style="width:120px" pattern="[0-9,\.]+" class="form-control qtyprice" type="text" zippy="amount">
                    </div>                 
                    <div class="mb-2">
                        <label for="notes">{{#t}}common.prymitka{{/t}} </label>

                        <textarea class="form-control"   zippy="notes"></textarea>

                    </div>        
                </div>

            </div>


            <div class="row">
                <div class="col-12 col-md-6 d-flex justify-content-end pt-4"">
                    <input type="button" value="{{#t}}common.skasuvaty{{/t}}" zippy="backtolist" class="btn   btn-secondary ms-2">
                    <input zippy="savedoc" type="submit" value="{{#t}}common.zberehty{{/t}}" class="btn   btn-info ms-2">
                    <input zippy="execdoc" type="submit" value="{{#t}}common.provesty{{/t}}" class="btn btn-success ms-2 ">

                </div>
            </div>


        </form>


    </body>

</html>
