<html>
    <head>
          <title> {{#t}}doc.task.vyrobnychyi_nariad{{/t}}</title>
    </head>

    <body>
 

        
            <h3> {{#t}}doc.task.vyrobnychyi_nariad{{/t}}
                <i class="fa fa-info-circle" style="cursor:pointer;font-size:16px;" data-container="body" data-bs-toggle="popover"
                    data-bs-placement="bottom" data-bs-content="Документ, що фіксує виконання виробничих завдань.
                   Для списання витратних матеріалів на підставі наряду, можна створити документ  
                   'Списання на виробництво'."></i>

            </h3>

            <div class="row">
           
                <div class="col-12 col-md-4 col-xl-4">
                <form zippy="docform">            
                     <div class="col-12">
                    <div class="mb-2">
                        <label for="document_number">{{#t}}common.nomer_dokumenta{{/t}}</label>
                        <input style="width:120px;" class="form-control" type="text" zippy="document_number"  required="on" >
                    </div>

                    <div class="mb-2">
                        <label for="parea">{{#t}}common.vyrobnycha_dilianka{{/t}}</label>
                        <select class="form-control" zippy="parea">
                            <option value="0">{{#t}}common.ne_obrano{{/t}}</option>
                        </select>
                    </div>
    

                
                    <div class="mb-2">
                        <label for="document_date"> {{#t}}doc.task.data_pochatku{{/t}}</label>
                        <div class="input-group">
                            <input   class="form-control"   zippy="document_date"  required="on" >
                            <span class="input-group-text">:</span>
                            <input   class="form-control"   zippy="document_time"  required="on" >
                        </div>                        
                    </div>

                    <div class="mb-2">
                        <label for="taskhours">{{#t}}doc.task.kil_hodyn{{/t}}</label>

                        <input style="width:100px;" pattern="[0-9,\.]+" class="form-control qtyprice" type="text" zippy="taskhours">
                    </div>
                   <div class="mb-2">
                        <label for="customer">{{#t}}common.zamovnyk{{/t}}</label>
                        <input placeholder="{{#t}}common.pochnit_vvodyty{{/t}}" class="form-control" type="text" zippy="customer">
                    </div>
                    <div class="mb-2">
                        <label for="notes">{{#t}}common.prymitka{{/t}}</label>

                        <textarea class="form-control" type="text" zippy="notes"></textarea>

                    </div>
                 </div>  
                <div class="col-11 col-md-7 col-xl-7 d-flex justify-content-end pt-4">
                    <input type="button" value="{{#t}}common.skasuvaty{{/t}}" zippy="backtolist" class="btn btn-secondary   ms-2">
                    <input zippy="savedoc" type="submit" value="{{#t}}common.zberehty{{/t}}" class="btn btn-primary   ms-2">
                    <input zippy="execdoc" type="submit" value="{{#t}}common.na_vykonannia{{/t}}" class="btn btn-success  ms-2 ">
                </div>
              </form> 
                </div> 
                
                <div class="col-12 col-md-8 col-xl-6 offset-xl-1">
                 <div class="row">
                  <div class="col-12  ">


                    <h6><b>{{#t}}common.roboty{{/t}}</b></h6>
           <div class="navbar">

             <form zippy="editdetail"  >
                       <div class="row  ">
                         <div class="col-auto  ">
                        <select zippy="editservice" class="form-control select2  me-1">
                            <option value="0">{{#t}}common.ne_obrano{{/t}}</option>
                        </select>
                         </div>
            
                        <label class="col-form-label col-auto"   for="editqty">{{#t}}common.kil{{/t}}</label>
                        <div class="col-auto  ">
                        <input class="form-control me-2" type="text" zippy="editqty" pattern="[0-9\.]+" value="1"     style="width: 75px;">
                         </div>
                        <label class="col-form-label col-auto" title="{{#t}}doc.task.roztsinky_dlia_narakhuvannia_zarplaty{{/t}}" class="ms-2" for="editcost">{{#t}}common.vartist{{/t}}</label>
                        <div class="col-auto  ">
                           <input title="{{#t}}doc.task.roztsinky_dlia_narakhuvannia_zarplaty{{/t}}" class="form-control me-2" type="text" zippy="editcost" pattern="[0-9\.]+" value="0"     style="width: 75px;">
                         </div>
                        <label class="col-form-label col-auto" for="editdesc">{{#t}}common.komentar{{/t}}  </label>
                        <div class="col-auto  ">
                           <input class="form-control  me-2" type="text" zippy="editdesc"                          >
                        </div>
                        <div class="col-auto  ">
                          <input zippy="saverow" type="submit" value="+" class="btn btn-primary">
                        </div>
                     </div>     
                   </form>                    
                </div>              
                   
                   
                    <table class="table  table-sm">
                   
                        <tr zippy="detail">
                            <td zippy="service"></td>
                            <td zippy="category"></td>
                            <td zippy="desc"  ></td>


                            <td zippy="quantity" class="text-end"></td>
                            <td zippy="cost" class="text-end"></td>


                            <td class="text-end">

                                <a zippy="delete"><i class="fa fa-trash"></i></a>

                            </td>
                        </tr>


                    </table>
                   </div>
                  <div class="col-12  ">


                    <h6><b>{{#t}}common.hotova_produktsiia{{/t}}</b></h6>
          <div class="navbar">

             <form zippy="editdetailprod"  >
                     <div class="row  ">
                       <div class="col-auto  ">
                       <select zippy="editprod" class="form-control select2  me-1">
                            <option value="0">{{#t}}common.ne_obrano{{/t}}</option>
                        </select>
                          </div>  
                        <label class="col-form-label col-auto"   for="editqtyprod">{{#t}}common.kil{{/t}}</label>
                        <div class="col-auto  ">
                        <input class="form-control me-1" type="text" zippy="editqtyprod" pattern="[0-9\.]+" value="1"         style="width: 75px;">
                         </div>  
                        <label class="col-form-label col-auto" title="{{#t}}doc.task.roztsinky_dlia_narakhuvannia_zarplaty{{/t}}"   for="editprodcost">{{#t}}common.vartist{{/t}}</label>
                        <div class="col-auto  ">
                          <input title="{{#t}}doc.task.roztsinky_dlia_narakhuvannia_zarplaty{{/t}}" class="form-control  me-1" type="text" zippy="editprodcost" pattern="[0-9\.]+" value="0"     style="width: 75px;">
                         </div>  
                        <label class="col-form-label col-auto" title="{{#t}}doc.task.oblikova_tsina_pry_oprykhoduvanni_na{{/t}}"   for="editprodprice">{{#t}}doc.task.sobivartist{{/t}}</label>
                        <div class="col-auto  ">
                          <input title="{{#t}}doc.task.oblikova_tsina_pry_oprykhoduvanni_na{{/t}}" class="form-control  me-1" type="text" zippy="editprodprice" pattern="[0-9\.]+" value="0"     style="width: 75px;">
                        </div>    
                        <label class="col-form-label col-auto" for="editdescprod">{{#t}}common.komentar{{/t}}  </label>
                        <div class="col-auto  ">
                        <input class="form-control  me-1" type="text" zippy="editdescprod"                          >
                       </div>  
                       <div class="col-auto  ">
                        <input zippy="saverowprod" type="submit" value="+" class="btn btn-primary">
                       </div>  
                      </div>  
                   </form>                    
                </div>              
   

                    <table class="table  table-sm">
                   
                        <tr zippy="detailprod">
                            <td zippy="prod"></td>
                            <td zippy="item_code"></td>


                            <td zippy="descprod"  ></td>
                            <td zippy="quantityprod" class="text-end"></td>
                            <td zippy="costprod" class="text-end"></td>
                            <td zippy="priceprod" class="text-end"></td>


                            <td class="text-end">

                                <a zippy="deleteprod"><i class="fa fa-trash"></i></a>

                            </td>
                        </tr>


                    </table>
                   </div>
                  <div class="col-12  ">


                    <h6><b>{{#t}}common.vykonavtsi{{/t}}</b></h6>
              <div class="navbar  ">    
                <form zippy="editdetail3"  >
                <div class="row">
                     <div class="col-auto  ">
                        <select zippy="editemp" class="form-control  me-2  ">
                            <option value="0">{{#t}}common.ne_obrano{{/t}}</option>
                        </select>
                     </div>
                        <label class="col-form-label col-auto"   for="editktu">{{#t}}doc.task.ktu{{/t}}</label>
                       <div class="col-auto  ">
                        <input zippy="editktu" class="form-control qtyprice me-2 " pattern="[0-9,\.]+" style="width:50px" >
                       </div>     
                        <div class="col-auto  ">
                          <input zippy="saverow3" type="submit" value="+" class="btn btn-primary">
                         </div>
                     </div>
                   </form>                    
                     
                   </div>  
                    <table class="table  table-sm">
               
                        <tr zippy="detail3">

                            <td zippy="empname"></td>
                            <td zippy="empktu"  ></td>
                            <td class="text-end">
                                <a zippy="delete3"><i class="fa fa-trash"></i></a>
                            </td>
                        </tr>
                    </table>
                   </div>
                  <div class="col-12 ">

              
                     <h6><b>{{#t}}doc.task.ustatkuvannia{{/t}}</b></h6>
                     
               <form zippy="editdetail4"  >
                      <div class="row  ">
                       <div class="col-auto  ">
                         <select zippy="editeq" class="form-control select2">
                            <option value="0">{{#t}}common.ne_obrano{{/t}}</option>
                         </select>
                       </div>
                         
                       <div class="col-auto  ">
                         <input zippy="saverow4" type="submit" value="+" class="btn btn-primary ms-2">
                      </div>
                    </div> 
                        
                   </form>                    
                       
                     
                    <table class="table  table-sm">
                 
                        <tr zippy="detail4">

                            <td zippy="eq_name"></td>
                            <td zippy="eq_code"></td>
                            <td class="text-end">
                                <a zippy="delete4"><i class="fa fa-trash"></i></a>
                            </td>
                        </tr>
                    </table>

                    </div>
          
                </div>
       
               </div>
            

        </div> 
        
      

    </body>
</html>
