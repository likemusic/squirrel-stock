<html>
    <head>
          <title> {{#t}}doc.incomemoney.prybutkovyi_order{{/t}}</title>
    </head>
    <body>


        <form zippy="docform">
            <h3> {{#t}}doc.incomemoney.prybutkovyi_order{{/t}}</h3>
            <div class="row">
                <div class="col-12 col-md-4 col-xl-3">

                    <div class="mb-2">
                        <label for="document_number">{{#t}}common.nomer_dokumenta{{/t}}</label>
                        <input style="width:120px" class="form-control" type="text" zippy="document_number">
                    </div>
                    <div class="mb-2">
                        <label for="document_date"> {{#t}}common.data{{/t}}</label>
                        <input class="form-control" type="text" zippy="document_date"  required="on" >
                    </div>
                    <div class="mb-2">
                        <label for="payment">{{#t}}common.kasa_rakhunok{{/t}}</label>
                        <select class="form-control" zippy="payment">
                        </select>
                    </div>
                    <div class="mb-2">
                        <label for="amount">{{#t}}common.suma{{/t}}</label>
                        <input pattern="[0-9,\.]+" class="form-control qtyprice" type="text" zippy="amount">
                    </div>
                  

                </div>
                <div class="col-12 col-md-4 col-xl-3">
                    <div class="mb-2">
                        <label for="detail">{{#t}}common.typ_operatsii{{/t}}</label>
                        <select class="form-control" zippy="detail">
                            <option value="0">{{#t}}doc.incomemoney.sluzhbove_vnesennia_koshtiv{{/t}}</option>
                            <option value="1">{{#t}}doc.incomemoney.oplata_vid_pokuptsia{{/t}}</option>
                            <option value="2">{{#t}}doc.incomemoney.povernennia_vid_postachalnyka{{/t}}</option>
                        <!--    <option value="3">Прибуток від співробітника</option>  -->
                        </select>
                    </div>

                    <div class="mb-2">
                        <label data-label="customer" for="customer">{{#t}}common.kontrahent{{/t}}</label>
                        <input class="form-control" type="text" zippy="customer">
                    </div>
                    <div class="mb-2">
                        <label data-label="contract" for="contract">{{#t}}common.dohovir{{/t}}</label>
                        <select class="form-control  " zippy="contract">
                            <option value="0">{{#t}}common.ne_obrano{{/t}}</option>
                        </select>
                    </div>
                    <div class="mb-2">
                        <label data-label="emp" for="emp">{{#t}}common.spivrobitnyk{{/t}}</label>
                        <select class="form-control select2" zippy="emp">
                            <option value="0">{{#t}}common.ne_obrano{{/t}}</option>
                        </select>
                    </div>
         
                     <div class="mb-2">
                        <label data-label="mtype"  for="mtype">{{#t}}doc.incomemoney.typ_dokhodu{{/t}}</label>
                        <select class="form-control" zippy="mtype">
                            <option value="0">{{#t}}common.ne_obrano{{/t}}</option>
                        </select>
                    </div>
                    <div class="mb-2">
                        <label for="notes">{{#t}}common.prymitka{{/t}} </label>

                        <textarea class="form-control"   zippy="notes"></textarea>

                    </div>

                </div>
            </div>

            <div class="row">
                <div class="col-11 col-md-7 col-xl-5 d-flex justify-content-end pt-4">
                    <input type="button" value="{{#t}}common.skasuvaty{{/t}}" zippy="backtolist" class="btn   btn-secondary   ms-2">
                    <input zippy="savedoc" type="submit" value="{{#t}}common.zberehty{{/t}}" class="btn   btn-primary  ms-2">
                    <input zippy="execdoc" type="submit" value="{{#t}}common.provesty{{/t}}" class="btn btn-success  ms-2 ">

                </div>
            </div>


        </form>


    </body>

</html>
