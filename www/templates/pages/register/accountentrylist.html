<html>
     <head>
        <title> {{#t}}register.accountentrylist.zhurnal_provodok{{/t}}  </title>

    </head>
  <body>
        <div class="row">
            <div class="col-12  ">

                <h3>{{#t}}register.accountentrylist.zhurnal_provodok{{/t}}</h3>


                
                    <form zippy="filter"  >
                      <div class="row row-cols-sm-auto g-2 align-items-start ">
                          <div class="col-12">
                           <div class="input-group">
                  
                    <label   for="from"> {{#t}}common.z{{/t}} </label>
                        
                          <input type="text" class="form-control    " zippy="from" style="width:110px">
                        </div>
                        </div>
                         <div class="col-12">
                           <div class="input-group">
                        
                        <label   for="to"> {{#t}}common.po_2{{/t}} </label>
                        
                          <input type="text" class="form-control    " zippy="to" style="width:110px">
                        </div>
                        </div>
                         <div class="col-12">
                           <div class="input-group">
                
                        <label   for="facc"> {{#t}}common.rakhunok{{/t}} </label>
                     
                          <select class="form-select  " zippy="facc">
                            <option value="0">{{#t}}common.ne_obrano{{/t}}</option>
                         </select>
                        </div>
                        </div>
                         <div class="col-12">
                           <div class="input-group">
                        
                        <label   for="ftype"> {{#t}}common.vybraty{{/t}} </label>
                        
                         <select class="form-select  " zippy="ftype">
                            <option value="0">{{#t}}register.accountentrylist.vse{{/t}}</option>
                            <option value="1">{{#t}}register.accountentrylist.po_debetu{{/t}}</option>
                            <option value="2">{{#t}}register.accountentrylist.po_kredytu{{/t}}</option>
                         </select>
                         </div>
                         </div>
                        <div class="col-12  ">
                         <input type="submit" class="  btn btn-success  " value="{{#t}}common.ok{{/t}}">
                      </div>
                      </div>
                    </form>
                
            </div>
        </div>

        <div class="row">
            <div class="col-12 col-md-6 col-xl-4">


                <br><a zippy="csv">{{#t}}common.eksport_u_excel{{/t}}</a>

                <table class="table   table-sm   ">
                    <tr>

                        <th>{{#t}}common.data{{/t}}</th>
                        <th>{{#t}}common.debet{{/t}}</th>
                        <th>{{#t}}common.kredyt{{/t}}</th>
                        <th class="text-end">{{#t}}common.suma{{/t}}</th>
                        <th>{{#t}}common.dokument{{/t}}</th>
                        <th></th>
                        <th></th>


                    </tr>
                    <tr zippy="entrylist">

                        <td class="text-nowrap" zippy="date"></td>

                       
                        <td zippy="dt"></td>
                        <td zippy="ct"></td>
                        <td zippy="amount" class="text-end"></td>
                        <td zippy="number"></td>
                        <td ><small zippy="notes"></small></td>
                        <td  >

                            <a zippy="show" title="{{#t}}common.perehliad{{/t}}"><i class="fa fa-eye"></i></a>


                        </td>


                    </tr>

                </table>

                <div class="col-12 col-lg-8 mb-2" zippy="pag"></div>

              

            </div>

            <div class="col-12">
                <div zippy="docview"></div>
            </div>

        </div>





    </body>
</html>
