<html>

                        </div>

                         </div>

                           <div class="input-group">
                        <label   for="to"> {{#t}}common.po_2{{/t}} </label>
                        
                         <input type="text" class="form-control    " zippy="to" style="width:110px">

                         </div>                      
                         <div class="col-12">
                           <div class="input-group">
                        <label   for="searchtype"> {{#t}}common.typ{{/t}} </label>                          
                        
                         <input type="text" class="form-control" zippy="searchtype">
                          </div>
                          </div>
                          <div class="col-12">
                        <div class="form-check">
                            <input   class="form-check-input" type="checkbox" zippy="archive">
                            <label class="form-check-label me-2" for="archive">{{#t}}register.officelist.arkhivni{{/t}}</label>
                        </div>                         
                        </div>                         
                         <div class="col-12  "> 
                        <input placeholder="{{#t}}register.officelist.poshuk_po_kontekstu{{/t}}" class="form-control me-2" type="search" zippy="searchcontext" >
                        </div>
                         <div class="col-12  ">
                        <input type="submit" class="  btn btn-success  " value="{{#t}}common.ok{{/t}}">
                        </div>
                       <div class="col-12  ">
                       <a zippy="erase" title="{{#t}}common.skynuty_filtr{{/t}}"><i class="fa fa-eraser"></i></a>
                     </div>
                     </div>       
                    </form>
                </div>
                       <details class="mb-2 ms-2">
                        <summary >{{#t}}common.tehy{{/t}}</summary>
                        <span zippy="taglist"></span>
                     </details>
                <a href="/index.php?p=App/Pages/Doc/OfficeDoc" class="btn btn-primary btn-sm">{{#t}}register.officelist.stvoryty_novyi{{/t}}</a>
     
               
                <table class="table   table-sm   ">
                    <tr>
                        <th>{{#t}}common.nazva{{/t}}</th>

                        <th>{{#t}}common.nomer{{/t}}</th>
                        <th>{{#t}}common.data{{/t}}</th>

                        <th>{{#t}}common.status{{/t}}</th>
                        <th>{{#t}}common.vidpovidalnyi{{/t}}</th>


                        <th>{{#t}}common.prymitka{{/t}}</th>
                        <th></th>
                        <th></th>
                     


                    </tr>
                    <tr zippy="doclist">
                        <td >
                          <a zippy="title" ></a>
                        </td>

                        <td zippy="number"></td>
                        <td class="text-nowrap" zippy="date"></td>
                  

                        <td class="text-nowrap" zippy="state"></td>
                        <td  zippy="user"></td>
                        <td zippy="notes"></td>
                        <td >   <a zippy="copy" title="{{#t}}register.doclist.kopiia{{/t}}"><i class="fa fa-copy"></i></a>     </td>  
                        <td >  <a zippy="edit" title="{{#t}}common.redahuvannia{{/t}}"><i class="fa fa-edit"></i></a>                          </td>

                    </tr>

                <div zippy="pag">

                <a id="dankor"></a>

        </div>

            <div class="col-12">

                  <div class="navbar">
                  
                    <form zippy="buttons"  >
                       <div class="row  ">
                          <div class="col-auto  ">
                          <button zippy="binprocess" class="btn btn-info  ms-2"><i class="fa fa-gavel"></i> {{#t}}common.na_vykonannia{{/t}}</button>                         
                          </div>
                          <div class="col-auto  ">
                          <button zippy="bdone" class="btn btn-info  ms-2"><i class="fa fa-stamp"></i> {{#t}}common.vykonano{{/t}}</button>                         
                          </div>
                          <div class="col-auto  ">

                          </div>
                          <div class="col-auto  ">
                          <button zippy="bshift" class="btn btn-warning  ms-2"><i class="fa  fa-exchange"></i> {{#t}}common.vidklasty{{/t}}</button>                         
                          </div>

                          <button zippy="bcancel" class="btn btn-secondary  ms-2"><i class="fa  fa-undo"></i> {{#t}}common.skasuvaty{{/t}}</button>                         
                          </div>
                          <div class="col-auto  ">
                          <button zippy="bdelete" class="btn btn-danger  ms-2"><i class="fa  fa-trash"></i> {{#t}}common.vydalyty{{/t}}</button>                         
                          </div>
                           <div class="col-auto  ">
                         <button zippy="bapprove" class="btn btn-success  ms-4"><i class="fas fa-thumbs-up"></i> {{#t}}register.doclist.zatverdyty{{/t}}</button>                         
                         </div>
                          <div class="col-auto  ">
                          <button zippy="brefuse" class="btn btn-info  ms-2"><i class="fas fa-thumbs-down"></i> {{#t}}register.doclist.vidkhylyty{{/t}}</button>                         
                          </div>
                          <div class="col-auto  ">
                          <input zippy="refusecomm"  class="form-control   ms-1" placeholder="{{#t}}register.officelist.komentar_pry_vidkhylenni{{/t}}"  > 
                        </div></div>  
                    </form>
                    <form zippy="maint"  >
                     <div class="row  ">
                      <label class="col-form-label col-auto" data-label="musers" for="mstates"> {{#t}}common.vykonavets{{/t}} </label>
                          <div class="col-auto  ">
                            <select zippy="musers" class="form-control me-2">
                           </select>
                           </div>
                         <div class="col-auto  ">
                           <button zippy="buser" class="btn btn-success  me-2"> {{#t}}common.perevesty{{/t}}</button>
                         </div>
                       </div>
                    </form>
                 
                </div>

                <div zippy="docview"></div>

            </div>
        </div>

     <script>
           function check_bdelete() {
                return confirm("{{#t}}common.vydalyty_dokument{{/t}}")
           }
