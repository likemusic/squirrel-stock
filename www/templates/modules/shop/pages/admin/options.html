<html>


    <body>
      

        <div class="row ">
            <div class="col-12    col-md-7   col-xl-5   ">
                <h4>{{#t}}common.nalashtuvannia{{/t}}</h4>
                <small><i class="fa fa-exclamation-triangle"></i>
                {{#t}}mod.shop.options.priamyi_perekhid_do_katalohu_adresa{{/t}}
                </small>
                <form zippy="shop" enctype="multipart/form-data">
                    <div class="mb-2 row">
                        <label  class="col-6 col-form-label"  for="shopname">{{#t}}mod.shop.options.nazva_mahazynu{{/t}}</label>
                           <div class="col-6">
                            <input required="required" class="form-control " zippy="shopname"/>
                           </div>
                    </div>
                    <div class="mb-2 row">
                        <label  class="col-6 col-form-label"   for="logo">{{#t}}common.lohotyp{{/t}}</label>
                         <div class="col-6">
                            <input  accept="image/png,image/jpeg" type="file" class="form-control " zippy="logo"/>
                          </div>
                    </div>




                    <div class="mb-2 row">
                        <label  class="col-6 col-form-label"   for="shopdefpricetype">{{#t}}common.typ_tsiny{{/t}} </label>
                           <div class="col-6">
                            <select class="form-control" zippy="shopdefpricetype">
                            </select>
                          </div> 
                    </div>
                  {{#hideblock}}   
                  <div class="mb-2 row">
                        <label class="col-6 col-form-label"  for="defmf">{{#t}}mod.hr.options.kasa_za_zamovchanniam{{/t}}</label>
                        <div class="col-6">
                            <select class="form-control" zippy="defmf">
                                <option value="0">{{#t}}common.ne_vkazana{{/t}}</option>
                            </select>
                            <small class="form-text text-muted">{{#t}}mod.hr.options.iakshcho_oplata_ne_na_storoni{{/t}} </small>
                        </div> 
                    </div>
                 {{/hideblock}}    
                <div class="mb-2 row">
                        <label class="col-6 col-form-label" for="defstore">{{#t}}mod.shop.options.sklad_za_zamovchanniam{{/t}}</label>
                       <div class="col-6">
                        <select class="form-control" zippy="defstore">
                            <option value="0">{{#t}}common.ne_vkazanyi{{/t}}</option>

                        </select>
                       </div>  

                    </div>
            
                 <div class="mb-2 row">
                        <label  class="col-6 col-form-label"  for="salesource">{{#t}}common.dzherelo_prodazh{{/t}}</label>
                         <div class="col-6">
                        <select class="form-control" zippy="salesource">
                            <option value="0">{{#t}}common.ne_obrano{{/t}}</option>
                        </select>
                          </div>
                    </div>                    
                     
                    <div class="mb-2 row">
                     <div class="col-6">
                        <label     for="shopordertype">{{#t}}mod.shop.options.formuvaty_po_zamovlenniu{{/t}}             </label>
                             <i class="fa fa-info-circle  " data-bs-toggle="tooltip" data-bs-placement="top"
                                   title=" {{#t}}mod.shop.options.v_kasovomu_cheku_nemaie_dostavky{{/t}} "></i>
                               </div>     
                             <div class="col-6">
                            <select class="form-control " zippy="shopordertype">

                                <option value="0">{{#t}}mod.shop.options.zvychaine_zamovlennia{{/t}}</option>
                           {{#hideblock}} <option value="1">{{#t}}common.kasovyi_chek{{/t}}</option> {{/hideblock}}
                             {{#usefood}}     <option value="2">{{#t}}mod.shop.options.zamovlennia_kafe{{/t}}</option>    {{/usefood}} 

                            </select>
                            </div>  
                       
                    </div>
                      
                       {{#usebranch}}
                    <div class="mb-2 row">
                     <div class="col-6">
                        <label      for="shopdefbranch">{{#t}}common.filiia{{/t}} </label>
                              <i class="fa fa-info-circle  " data-bs-toggle="tooltip" data-bs-placement="top"
                                   title=" {{#t}}mod.shop.options.filiia_z_iakoiu_stvoriuiutsia_dokumenty{{/t}} "></i>
                        </div>              
                           <div class="col-6">
                            <select class="form-control" zippy="shopdefbranch">
                                <option value="0">{{#t}}common.ne_obrano{{/t}}</option>
                            </select>
                            </div>  
                      
                    </div>
                    {{/usebranch}}
                                   
                            

                    <div class="mb-2 row">
                        <label class="col-6 col-form-label"   for="email">{{#t}}mod.shop.options.e_mail_dlia_zviazku{{/t}}</label>
                               <div class="col-6">
                            <input class="form-control " zippy="email"/>
                            </div>
                    </div>
    
                  <div class="mb-2 row">
                        <label class="col-6 col-form-label"  for="phone">{{#t}}mod.shop.options.telefon_dlia_zamovlen{{/t}}</label>
                              <div class="col-6">
                            <input class="form-control " zippy="phone"/>
                          </div>
                  </div>
                  <div class="mb-2 row">
                        <label  class="col-6 col-form-label"  for="currencyname">{{#t}}mod.shop.options.hroshova_odynytsia{{/t}}</label>
                          <div class="col-6">
                            <input style="width:100px" class="form-control " zippy="currencyname"/>
                            </div>
                    </div>
                 <div class="mb-2 row">
                        <label  class="col-6 col-form-label"  for="pagesize">{{#t}}mod.shop.options.tovariv_na_storintsi{{/t}} </label>
                          <div class="col-6">
                            <input  style="width:100px" type="number" class="form-control " zippy="pagesize"/>
                            </div>
                    </div>
                   
                   

                    <div class="form-check">
                        <input zippy="usefilter" type="checkbox" class="form-check-input">
                        <label class="form-check-label" for="usefilter">{{#t}}mod.shop.options.pokazuvaty_filtr_vidboru{{/t}} </label>

                    </div>
                    <div class="form-check">
                        <input zippy="usefeedback" type="checkbox" class="form-check-input">
                        <label class="form-check-label" for="usefeedback">{{#t}}mod.shop.options.pokazuvaty_vidhuky{{/t}} </label>

                    </div>
                    <div class="form-check">
                        <input zippy="nouseimages" type="checkbox" class="form-check-input">
                        <label class="form-check-label" for="nouseimages">{{#t}}mod.shop.options.ne_pokazuvaty_zobrazhennia{{/t}}  </label>

                    </div>
                    <div class="form-check">
                        <input zippy="noshowempty" type="checkbox" class="form-check-input">
                        <label class="form-check-label" for="noshowempty">{{#t}}mod.shop.options.ne_pokazuvaty_iakshcho_nema_na{{/t}} </label>

                    </div>
              
         
                    <div class="form-check">
                        <input zippy="uselogin" type="checkbox" class="form-check-input">
                        <label class="form-check-label" for="uselogin">{{#t}}mod.shop.options.vkhid_v_kataloh_tilky_dozvolenym{{/t}} </label>
                         <i class="fa fa-info-circle  " data-bs-toggle="tooltip" data-bs-placement="top"
                                   title="{{#t}}mod.shop.options.dlia_dostupu_v_kataloh_kontrahent{{/t}} "></i>
                        
                    </div>
                    <div class="form-check">
                        <input zippy="usemainpage" type="checkbox" class="form-check-input">
                        <label class="form-check-label" for="usemainpage">{{#t}}mod.shop.options.vystavyty_kataloh_iak_holovnu_storinku{{/t}} </label>
                         <i class="fa fa-info-circle  " data-bs-toggle="tooltip" data-bs-placement="top"
                                   title=" {{#t}}mod.shop.options.kataloh_bude_vidkryvatysia_pry_perekhodi{{/t}} "></i>
                          
                        
                    </div>

         
                    <div class="  mt-2  ">
                        <div class="col-sm-4">
                            <button class="btn btn-primary" type="submit">{{#t}}common.zberehty{{/t}}</button>
                       
                        </div>
                    </div>

                </form>
               
                
               
                
                                          
            </div>
           
         
           
            <div class="col-12 col-md-4 col-xl-3    ">
                 <h4>{{#t}}mod.shop.options.onlain_oplata{{/t}}</h4>
                <form zippy="pay" >
                 
                    
                   <div class="mb-2">
                        <label data-label="mfqr"  for="mf">{{#t}}mod.shop.options.rakhunok_dlia_oplaty_po_qr{{/t}}  </label>
                            <select class="form-control" zippy="mfqr">
                              <option value="0">{{#t}}common.ne_obrano{{/t}}</option>
                              
                            </select>
                   </div>
                
                 <div class="  mt-2  ">
                        <div class="col-sm-4">
                            <button class="btn btn-primary" type="submit">{{#t}}common.zberehty{{/t}}</button>
                       
                        </div>
                    </div>
                </form>
             </div>
           
           
            
        </div>
        
        
        
        
  
        <script>
 

        </script>

    </body>
</html>
