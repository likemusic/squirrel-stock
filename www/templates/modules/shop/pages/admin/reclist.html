<html>

    <body>
        <style>
            .list-group-item {
                padding: 04px;
            }
        </style>
        <div class="row">
            <div class="col-12">
                <h3>{{#t}}common.rekomendovani_tovary{{/t}}</h3>
                <small>{{#t}}mod.shop.reclist.pokazuiutsia_lyshe_katehorii_u_iakykh{{/t}}</small>
            </div>
            <div class="col-12 col-md-6  ">
                <table class="table table-sm">
                    <tr zippy="grouplist">
                        <td ><a zippy="groupname"></a></td>
                    </tr> 

                </table>
            </div>

            <div class="col-12  col-md-6  ">
   
                <div zippy="recpanel" class="row">
                    <div  zippy="itemlistpanel" class="col-12     ">
                         
                        <a zippy="additem" class="btn     btn-primary">{{#t}}common.dodaty{{/t}}</a><br>
                        <table class="   table    table-sm ">
                            <tr>
                                <th>{{#t}}common.tovar{{/t}}</th>
                                <th>{{#t}}mod.shop.reclist.rekomendatsii{{/t}}</th>

                            </tr>
                            <tr zippy="itemlist">
                                <td ><span zippy="itemname" style="display:block"></span>
                                  <a class="text-success ms-4" zippy="itemedit">{{#t}}common.redahuvaty{{/t}}</a>
                                  <a class="text-danger" zippy="itemdel">{{#t}}common.vydalyty{{/t}}</a>   
                                </td>
                                <td zippy="recitems">
                                
                                
                                </td>
                               
                                
                           </tr>
                        </table>
                    </div>

                    <form zippy="itemeditform" >
                       <div class="col-12 col-xl-10 ">
                            <div class="mb-2 row">
                                <label class="col-2 col-form-label" for="edititem">{{#t}}common.tovar{{/t}}</label>
                                <div class="col-10">
                                    <select   class="form-control  " zippy="edititem">
                                        <option value="0">{{#t}}common.ne_vybranyi{{/t}}</option>
                                    </select>
                                </div>
                            </div>
                           <div class="mb-2 row">
                                <label   for="editrec">{{#t}}mod.shop.reclist.rekomendovanyi_tovar{{/t}}</label>
                                
                                  <div class="input-group  ">
                                      <input placeholder="{{#t}}common.pochnit_vvodyty{{/t}}"  class="form-control" zippy="editrec">
                                       
                                     
                                 
                                         <a title="{{#t}}mod.shop.reclist.dodaty_do_spysku{{/t}}" class="btn btn-success" zippy="addrec" >+</a>
                                                                    
                                 </div>
                          </div>
                           <table class="table table-sm">
                               <tr zippy="recitemlist">
                                  <td zippy="recitem">   </td> <td> <a zippy="recitemdel"> <i class="fa fa-trash text-danger"></i></a> </td>           
                               </tr>   
                           </table>
                         <div class="mb-2">
                              <a zippy="cancel"   class="btn btn-secondary   me-2 ">{{#t}}common.skasuvaty{{/t}}</a> 
                              <input zippy="save" type="submit" value="{{#t}}common.zberehty{{/t}}" class="btn btn-primary  ">
                              
                         </div>
              
                      </div> 
                        
                    </form>
                    
                 
                    
                </div>


            </div>
        </div>
    
    </body>
</html>
