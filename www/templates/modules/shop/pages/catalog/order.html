<html>
 
    <body>
        <div class="row"  >
            <div class="col-12 col-md-8   ">
                <h3 class="mt-2 mb-3">{{#t}}service.armfood.oformlennia_zamovlennia{{/t}}</h3>
                <form zippy="listform" method="post">
                    <table class="table table-bordered" style="border-bottom: none;">
                        <tr>
                            <th style="width:64px">&nbsp;</th>
                            <th>{{#t}}common.naimenuvannia{{/t}}</th>
                            <th>{{#t}}common.kil{{/t}}</th>
                            <th style="text-align: right;">{{#t}}common.tsina{{/t}}</th>

                            <th></th>
                        </tr>
                        <tr zippy="pitem">
                            <td><img zippy="photo" style="width: 64px;"/></td>
                            <td><a zippy="pname"></a></td>

                            <td><input onchange=" $('#listform').submit()  " class="_number" style="width: 60px;border: 1px solid #ced4da;border-radius: 0.25rem;padding: 2px 5px;" type="number" zippy="quantity"/></td>
                            <td style="text-align: right;" zippy="price"></td>
                            <td><a zippy="delete"><i class="fa fa-trash"></i></a></td>
                        </tr>
                        <tr>
                            <td></td>
                            <td></td>
                            <td style="text-align: right;"><span data-label="disc">{{#t}}common.znyzhka_2{{/t}}</span></td>
                            <td style="text-align: right;"><span zippy="disc"></span></td>

                            <td></td>
                        </tr>                        <tr>
                            <td></td>
                            <td></td>
                            <td style="text-align: right;"><b>{{#t}}common.vsoho_na_sumu{{/t}}</b></td>
                            <td style="text-align: right;"><b><span zippy="summa"></span></b></td>

                            <td></td>
                        </tr>
                    </table>

                </form>
            </div>
     
            <div class="col-12"  >   
              

            <form zippy="orderform" method="post" class="row">
     
              <div class="col-12 col-md-8 col-lg-6    col-xl-4  ">
                    <div class="mb-2 row">
                       
                     <label class="col-5 col-form-label" for="firstname" >{{#t}}mod.shop.order.imia_nazva_dlia_kompanii{{/t}} </label>
                      <div class="col-7">
                         <input required="required" zippy="firstname" class="form-control">
                      </div>
                    </div>
                   <div class="mb-2 row">
                       
                     <label class="col-5 col-form-label" for="lastname" > {{#t}}mod.shop.order.prizvyshche{{/t}}</label>
                      <div class="col-7">
                         <input   zippy="lastname" class="form-control">
                      </div>
                    </div>
                    <div class="mb-2 row">
                      
                      <label class="col-5 col-form-label" for="phone" >{{#t}}common.telefon{{/t}}</label>
                        
                       <div class="col-7">
                       <input zippy="phone" class="form-control">
                    </div>
                    </div>
                    <div class="mb-2 row">
                      
                      <label class="col-5 col-form-label" for="email" >E-mail</label>
                       
                       <div class="col-7">
                       <input zippy="email" class="form-control">
                     </div>
                    </div>
                     {{#usepayment}}
                    <div class="mb-2 row">
                    
                            <label class="col-5 col-form-label" for="paytype"  >{{#t}}common.oplata{{/t}}</label>
                      
                       <div class="col-7">
                       <select class="form-control" zippy="paytype">
                            <option value="0">{{#t}}mod.shop.order.obraty{{/t}}</option>                       
                            <option value="2">{{#t}}mod.shop.order.hotivkoiu_pry_otrymanni{{/t}}</option>
                            <option value="1">{{#t}}mod.shop.options.onlain_oplata{{/t}}</option>
                        </select>
                      </div>
                    </div> 
                   {{/usepayment}}    
               
                    </div> 
               
                <div class="col-12 col-md-8 col-lg-6 col-xl-4     ">
               
                    <div class="mb-2 row">
                    
                       <label class="col-5 col-form-label" for="delivery">{{#t}}common.dostavka{{/t}}</label>
                      
                       <div class="col-7">
                       <select class="form-control" zippy="delivery">
                            <option value="0">{{#t}}mod.shop.order.obraty{{/t}}</option>
                        </select>
                      </div>
                    </div>
                      {{#np}}
                   <div class="mb-2 row">
                        <label class="col-3 col-form-label" for="baycity">{{#t}}common.naselenyi_punkt{{/t}}</label>
                      <div class="col-9">
                        <input placeholder="{{#t}}common.pochnit_vvodyty{{/t}}" zippy="baycity" class="form-control   "/>

                        </div>
                    </div>
                    <div class="mb-2 row">
                        <label class="col-3 col-form-label" for="baypoint">{{#t}}common.viddilennia{{/t}}</label>
                        <div class="col-9">
                         <input placeholder="{{#t}}common.pochnit_vvodyty{{/t}}" zippy="baypoint" class="form-control   "/>
                         <small>{{#t}}common.dlia_poshuku_po_nomeru_dodaite{{/t}}</small>
                       </div>                   
                    </div>                   
                       {{/np}}

                    <div class="mb-2 row">
             
                        <label class="col-3 col-form-label" data-label="address" for="address"  >{{#t}}common.adresa_2{{/t}}</label>
                      
                        <div class="col-9">
                          <textarea style="height:100px" zippy="address" class="form-control"></textarea>
                        </div>
                    </div>
                      <div class="mb-2 row">
                      
                      <label class="col-3 col-form-label" for="deltime" >{{#t}}common.chas_dostavky{{/t}}</label>
                       
                       <div class="col-9">
                           <div class="input-group">
                         <input   class="form-control"   zippy="deldate" required="required">
                           <span class="input-group-text">:</span>
                             <input   class="form-control"   zippy="deltime" required="required">
                           </div>
                       </div>
                    </div>

                    <div class="mb-2 row">
                    
                          <label class="col-3 col-form-label" for="notes" >{{#t}}common.komentar{{/t}} </label>
                       
                          <div class="col-9">
                              <textarea zippy="notes" class="form-control"></textarea>
                        </div>
                    </div>

              </div>
           
              
            
            <div class="  col-12">
                <input type="submit" class="btn btn-primary" value="{{#t}}common.vidpravyty{{/t}} ">
            </div>
        
            
           </form> 
        
       
           </div>
       </div>    
      
        
    </body>
</html>
