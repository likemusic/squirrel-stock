<html>

    <body>

        <div class="row  ">
            <div class="col-12  col-sm-10 col-md-6    col-xl-4  ">
                <h4>{{#t}}common.nalashtuvannia_ziednannia{{/t}}</h4>
                <form zippy="cform">
                    <div class="mb-2">
                        <label for="site">{{#t}}common.adresa_saitu{{/t}}</label>
                        <input type="text" zippy="site" class="form-control" required="required"/>
                         <small>{{#t}}mod.hr.options.potribno_vvodyty_povnu_adresu{{/t}}</small>
                    </div>               
                    <div class="mb-2">
                        <label for="login">{{#t}}common.lohin{{/t}}</label>
                        <input  zippy="login" class="form-control" required="required"/>
                    </div>
                   <div class="mb-2">
                        <label for="password">{{#t}}common.parol{{/t}}</label>
                        <input  zippy="password" class="form-control" required="required"/>
                    </div>
                   
                     
                    <div class="mb-2">
                        <label for="defpricetype">{{#t}}common.typ_tsiny{{/t}} </label>

                        <select class="form-control" zippy="defpricetype">
                            <option value="0">{{#t}}common.ne_obrano{{/t}}</option>

                        </select>

                    </div>
                   <div class="mb-2">
                        <label for="defmf">{{#t}}mod.hr.options.kasa_za_zamovchanniam{{/t}}</label>

                        <select class="form-control" zippy="defmf">
                            <option value="0">{{#t}}common.ne_vkazana{{/t}}</option>

                        </select>
                        <small class="form-text text-muted">{{#t}}mod.hr.options.iakshcho_oplata_ne_na_storoni{{/t}} </small>

                    </div>
                  
                    <div class="mb-2">
                        <label for="salesource">{{#t}}common.dzherelo_prodazh{{/t}}</label>
                        <select class="form-control" zippy="salesource">
                            <option value="0">{{#t}}common.ne_obrano{{/t}}</option>
                        </select>
                    </div>   
                     <div class="form-check">
                        <input zippy="insertcust" type="checkbox" class="form-check-input">
                        <label class="form-check-label" for="insertcust">{{#t}}common.importuvaty_kontrahentiv{{/t}} </label>
                        <small class="form-text text-muted">{{#t}}mod.hr.options.importuvaty_kliientiv_z_im_v{{/t}}</small>
                        <br>
                    </div>
                    <div class="form-check">
                        <input zippy="ssl" type="checkbox" class="form-check-input">
                        <label class="form-check-label" for="ssl">{{#t}}common.perevirka_ssl_sertyfikata{{/t}} </label>

                    </div>                                  
                    <div class="mb-2">
                        <input type="submit" value="{{#t}}common.zberehty{{/t}}" zippy="save" class="btn   btn-primary me-2"/>
                        


                    </div>
                </form>
            </div>
        </div>
        <script>

            function check_check() {

                  document.getElementById('dialogwait').showModal()
            }

        </script>

    </body>
</html>
