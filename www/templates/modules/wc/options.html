<html>

    <body>

        <div class="row  ">
            <div class="col-12  col-sm-10 col-md-6    col-xl-4  ">
                <h4>{{#t}}common.nalashtuvannia_ziednannia{{/t}}</h4>
                <form zippy="cform">
                    <div class="mb-2">
                        <label class="form-label" for="site">{{#t}}common.adresa_saitu{{/t}}</label>
                        <input type="text" zippy="site" class="form-control" required="required"/>
                    </div>
                    <div class="mb-2">
                        <label class="form-label" for="keyc">{{#t}}common.kliuch{{/t}}</label>
                        <input placeholder="ck_XXXXXXXXXXXXXXXXXXXX" zippy="keyc" class="form-control" required="required"/>
                    </div>
                    <div class="mb-2">
                        <label class="form-label" for="keys">{{#t}}mod.wc.options.sekretnyi_kliuch{{/t}}</label>
                        <input placeholder="cs_XXXXXXXXXXXXXXXXXXXX" zippy="keys" class="form-control" required="required"/>
                    </div>
                    <div class="mb-2">
                        <label class="form-label" for="api">{{#t}}mod.wc.options.versiia_api{{/t}} </label>

                        <select class="form-select" zippy="api"> </select>

                    </div>
                     {{#hideblock}}
                    <div class="form-check">
                        <input class="form-label" zippy="ssl" type="checkbox" class="form-check-input">
                        <label class="form-check-label" for="ssl">{{#t}}common.perevirka_ssl_sertyfikata{{/t}} </label>

                    </div>
                     {{/hideblock}}
              
                 <div class="mb-2">
                        <label class="form-label" for="salesource">{{#t}}common.dzherelo_prodazh{{/t}}</label>
                        <select class="form-select" zippy="salesource">
                            <option value="0">{{#t}}common.ne_obrano{{/t}}</option>
                        </select>
                    </div>                    
                     
                    <div class="mb-2">
                        <label class="form-label" for="defpricetype">{{#t}}common.typ_tsiny{{/t}} </label>

                        <select class="form-select" zippy="defpricetype">
                            <option value="0">{{#t}}common.ne_obrano{{/t}}</option>

                        </select>

                    </div>
                     <div class="mb-2">
                        <label class="form-label" for="defpaytype">{{#t}}common.sposib_oplaty{{/t}} </label>

                        <select class="form-select" zippy="defpaytype">
                            <option value="0">{{#t}}common.ne_vkazano{{/t}}</option>

                        </select>
                        

                    </div>                    
                     <div class="mb-2">
                        <label class="form-label" for="defmf">{{#t}}common.kasa{{/t}}  </label>

                        <select class="form-select" zippy="defmf">
                            <option value="0">{{#t}}common.ne_vkazana{{/t}}</option>

                        </select>
                         <small class="form-text text-muted">{{#t}}common.oboviazkova_iakshcho_typ_oplaty_peredpla{{/t}} </small>
  
                    </div>
                      <div class="mb-2">
                        <label class="form-label" for="defstore">{{#t}}common.sklad{{/t}}</label>

                        <select class="form-select" zippy="defstore">
                            <option value="0">{{#t}}common.ne_vkazanyi{{/t}}</option>

                        </select>
                       
                    </div>
                      <div class="form-check">
                        <input zippy="reserve" type="checkbox" class="form-check-input">
                        <label class="form-check-label" for="reserve">{{#t}}mod.ocstore.options.avtomatychno_rezervuvaty_tovary{{/t}} </label>
                         
                    </div>
              
                    <div class="form-check">
                        <input zippy="dostore" type="checkbox" class="form-check-input">
                        <label class="form-check-label" for="dostore">{{#t}}mod.ocstore.options.spysuvatyy_tovary_v_zamovlenni{{/t}} </label>
                        <small class="form-text text-muted">{{#t}}mod.ocstore.options.iakshcho_ne_vykorystovuietsia_ttn_chek{{/t}}  </small>
  
                    </div>
              
                    <div class="form-check">
                        <input zippy="insertcust" type="checkbox" class="form-check-input">
                        <label class="form-check-label" for="insertcust">{{#t}}common.importuvaty_kontrahentiv{{/t}} </label>
                       
                    </div>                                   
                    <div class="my-2">
                        <input type="submit" value="{{#t}}common.zberehty{{/t}}" zippy="save" class="btn   btn-primary me-2"/>
                        
                        <div id="loader" style="display:none" class="spinner-border spinner-border-sm"></div>

                    </div>
                </form>
            </div>
        </div>
        <script>

            function check_check() {

                $('#loader').removeAttr('style');
            }

        </script>

    </body>
</html>
