<html>

    <body>

        <div class="row ">
            <div class="col-10  col-md-4 col-xl-3">

                <h4>{{#t}}common.mii_profil{{/t}}</h4>
                <form   zippy="profileform">
              
                               
                            <div class="mb-2">
                                <label for="customer_name">{{#t}}common.nazva{{/t}}  </label>
                                <input   class="form-control" zippy="customer_name" required="required">
                            </div>
                          
                            <div class="mb-2">
                                <label for="email">E-mail</label>
                                <input type="email" class="form-control" zippy="email">
                            </div>
                         
                            <div class="mb-2">
                                <button type="submit" zippy="submitpass" class="btn btn-primary">{{#t}}common.zberehty{{/t}}</button>
                            </div>

                              
                </form>
            </div>
   <div class="col-10  col-md-4 col-xl-3">

                <h4>{{#t}}common.zmina_parolia{{/t}}</h4>
                <form role="form" zippy="passwordform">

                    <div class="mb-2">
                        <label for="userpassword">{{#t}}common.parol{{/t}}</label>
                        <input type="password" class="form-control" zippy="userpassword" required="required">
                    </div>

                    <div class="mb-2">
                        <label for="userpassword">{{#t}}common.pidtverdzhennia{{/t}}</label>
                        <input type="password" class="form-control " zippy="confirmpassword" required="required">
                    </div>

                    <button type="submit" zippy="submitpass" class="btn btn-primary">{{#t}}common.zberehty{{/t}}</button>
                </form>
                <br>


            </div>

        </div>


    </body>

</html>
