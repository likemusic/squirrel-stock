<html>

    <body>

        <div class="row  ">
            <div class="col-12    col-md-10    col-xl-8  " zippy="itemtable">
                <h4>{{#t}}mod.df.items.moi_tovary{{/t}}  </h4>
           
            <div class="navbar  ">

                    <form zippy="filter"  >
                       <div class="row  ">
                       <label class="col-form-label col-auto" for="search">{{#t}}common.poshuk{{/t}}</label>
                       <div class="col-auto  ">
                         <input autocomplete="off" placeholder="{{#t}}common.ph.search{{/t}}" class="form-control me-2" type="search" zippy="searchkey"  >
                       </div> 
                      <label class="col-form-label col-auto" for="searchcat">{{#t}}common.katehoriia_2{{/t}}</label>
                       <div class="col-auto  ">
                        <select class="form-control me-2" zippy="searchcat">
                           <option value="0">{{#t}}common.ne_vkazano{{/t}}</option>
                        </select>
                      </div> 
                       <label class="col-form-label col-auto" class="col-auto mt-2"  for="searchbrand">{{#t}}common.brend{{/t}} </label>
                        <div class="col-auto  ">
                          <input autocomplete="off"   class="form-control me-2" zippy="searchbrand"/>
                        </div>      
                        <div class="col-auto  ">
                          <input class="btn btn-success  " type="submit" value="{{#t}}common.ok{{/t}}">
                        </div> 
                    </div>         
                     </form>
                     
               </div>      
              <a zippy="addnew" class="btn btn-primary ms-4  ">    {{#t}}common.dodaty_novyi{{/t}}</a>
             
             <table class="table   table-sm      ">
                  <thead> 
                   <tr>
                      <th  >{{#t}}common.naimenuvannia{{/t}}</th>
                        <th  >{{#t}}common.artykul{{/t}}</th>
                        <th  >{{#t}}common.katehoriia{{/t}}</th>
                        <th  >{{#t}}common.brend{{/t}}</th>
                        <th class="text-end" >{{#t}}common.tsina{{/t}}</th>
                        <th class="text-end" >{{#t}}common.na_skladi{{/t}}</th>
                        <th   > </th>
                        <th   > </th>
             
                  </tr> 
                     </thead>
                    <tbody>
                        <tr zippy="itemlist">
                            <td  > <a zippy="itemname"></a></td>
                            <td    zippy="item_code"> </td>
                            <td    zippy="cat_name"></td>
                            <td    zippy="brand"></td>
                            <td  class="text-end"  zippy="price"></td>
                            <td  class="text-end"  zippy="qty"></td>
                            <td     ><small zippy="description"></small>  </td>
                            <td   >
                                 <a zippy="del" title="{{#t}}common.vydalyty{{/t}}"><i class="fa fa-trash text-danger"></i></a>  
                           
                            </td>
                         
                        </tr>
                 </tbody>
                </table>  
                <div class="w-50" zippy="pag"></div>                                               
            </div>
            
        <div class="col-12  col-md-6 col-xl-4">
                <form zippy="itemdetail"  >
                    <h4>{{#t}}common.redahuvannia{{/t}}   </h4>
                           <div class="mb-2 row">
                                <label class="col-5 col-form-label" for="editname">{{#t}}common.naimenuvannia{{/t}}</label>
                                <div class="col-7">
                                    <input required="on" autofocus="on"   class="form-control" zippy="editname"/>
                                </div>
                            </div> 
                             <div class="mb-2 row">
                                <label class="col-5 col-form-label" for="editcode">{{#t}}common.artykul{{/t}}</label>
                                <div class="col-7">
                                    <input readonly="on" required="on"     class="form-control" zippy="editcode"/>
                                </div>
                            </div> 
                          <div class="mb-2 row">
                                <label class="col-5 col-form-label" for="editbarcode">{{#t}}common.shtrykh_kod{{/t}}</label>
                                <div class="col-7">
                                    <input      class="form-control" zippy="editbarcode"/>
                                </div>
                            </div> 
                            <div class="mb-2 row">
                                <label class="col-5 col-form-label" for="editcat">{{#t}}common.katehoriia{{/t}}</label>
                                <div class="col-7">
                                    <select class="form-control" zippy="editcat">
                                        <option value="0">{{#t}}common.ne_vkazano{{/t}}</option>
                                    </select>
                                </div>
                            </div> 
                             <div class="mb-2 row">
                               <label class="col-5 col-form-label" for="editbrand">{{#t}}common.brend{{/t}}</label>
                                <div class="col-7">
                                    <input       class="form-control" zippy="editbrand"/>
                                </div>
                            </div> 
                            <div class="mb-2 row">
                               <label class="col-5 col-form-label" for="editprice">{{#t}}common.tsina{{/t}}</label>
                                <div class="col-7">
                                    <input pattern="[0-9\.]+" style="width:100px"   class="form-control" zippy="editprice"/>
                                </div>
                            </div> 
                           <div class="mb-2 row">
                               <label class="col-5 col-form-label" for="editmsr">{{#t}}common.od_vym{{/t}}</label>
                                <div class="col-7">
                                    <input   style="width:100px"   class="form-control" zippy="editmsr"/>
                                </div>
                            </div> 
                            
                    
                            
                            <div class="mb-2 row">
                               <label class="col-5 col-form-label" for="editdesc">{{#t}}common.opys{{/t}}</label>
                                <div class="col-7">
                                    <textarea     class="form-control" zippy="editdesc"></textarea>
                                </div>
                            </div> 
                       
                  <div class="w-100   ">

                           
                                <input zippy="cancel" type="button" value="{{#t}}common.skasuvaty{{/t}}" class="btn btn-secondary ms-4 "> 
                                <input zippy="save" type="submit" value="{{#t}}common.zberehty{{/t}}" class="btn btn-primary  ">
                                
                           
                        </div>            
                                                       
                </form>
        </div>
     </div>
   
    <script>        
            
        function check_del() {
            return confirm("Видалити?")
        }   
                 
    </script>
    </body>
</html>
