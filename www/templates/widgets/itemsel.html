<html>
    <body>
     <div   zippy="witempan" class="row">  
           <form zippy="wisfilter"  >
            <div class="row row-cols-sm-auto g-2 align-items-start mb-1">
                 <div class="col-12">
                   <div class="input-group">
      
                <label   for="wissearchkey">{{#t}}common.poshuk_2{{/t}}</label>
                
                  <input   class="form-control ms-sm-2" type="text" zippy="wissearchkey">
                </div>
                </div>
                 <div class="col-12">
                   <div class="input-group">
               <label   for="wissearchcat">{{#t}}common.katehoriia_2{{/t}}</label>
            
                <select class="form-select  " zippy="wissearchcat">
                    <option value="0">{{#t}}common.ne_zadano{{/t}}</option>
                </select>
                </div>
                </div>
               <div class="col-12">
                   <div class="input-group">
                      
                <label class="col-form-label col-auto" for="searchtype">{{#t}}common.typ{{/t}} </label>
                
                   <select zippy="searchtype" class="form-select  ">
                        <option value="0">{{#t}}common.vsi{{/t}} </option>
                        <option value="1">{{#t}}common.tovary{{/t}}</option>
                        <option value="2">{{#t}}widgets.itemsel.mat_ta_kompl{{/t}}</option>
                        <option value="3">{{#t}}common.mshp{{/t}}</option>
                        <option value="4">{{#t}}common.hotova_produktsiia{{/t}}</option>
                        <option value="5">{{#t}}common.napivfabrykaty{{/t}}</option>
                      
                    </select>
                  </div>
                  </div>
                <div class="col-12">
                   <div class="input-group">
                
                  
                <label   for="wissearchmanufacturer">{{#t}}common.brend{{/t}} </label>
               
                <input autocomplete="off" list="wissearchmanlist" class="form-control me-2" zippy="wissearchmanufacturer"/>
                <datalist id="wissearchmanlist">
                    {{#manlist}}
                    <option label="{{mitem}}" value="{{mitem}}">  </option>
                        {{/manlist}}
                </datalist>
               </div>   
               </div>   
               
               <div class="col-12">    
                 <div class="form-check   ">
                   <label for="wissearchonstore" class="form-check-label">{{#t}}common.v_naiavnosti{{/t}} </label> 
                   <input type="checkbox" zippy="wissearchonstore" class="form-check-input  me-2"  >
                  </div>                  
              </div>    
               <div class="col-12  ">      
                <input class="btn btn-success  " type="submit" value="{{#t}}common.ok{{/t}}">
              </div>
              </div>
            </form>
       
        <table class="table table-sm" zippy="witemselt">

        </table>

         </div>
       
         <div   zippy="weditpan" class="row">  
           <div   class="col-12 col-md-10 col-xxl-8">  
       
             <form zippy="weditform"  >
                 <h4>{{#t}}doc.serviceact.redahuvannia_tmts{{/t}}  </h4>
                 <small> {{#t}}widgets.itemsel.zminy_onovliat_takozh_dovidnyk_nomenklat{{/t}}  </small>
              
                 <div class="mb-2 row">
                    <label class="col-5 col-form-label" for="weditname">{{#t}}common.naimenuvannia{{/t}}</label>
                    <div class="col-7">
                        <input required="on" autofocus="on"   class="form-control" zippy="weditname"/>
                    </div>
                </div>
                 <div class="mb-2 row">
                        <label class="col-5 col-form-label" for="weditbarcode">{{#t}}common.shtrykh_kod_2{{/t}} </label>
                        <div class="col-5">
                            <input class="form-control" zippy="weditbarcode"/>
                            <small   >{{#t}}reference.itemlist.latynski_bukvy_i_tsyfry{{/t}}</small>
                        </div>
                    </div>
                    <div class="mb-2 row">
                        <label class="col-5 col-form-label" for="weditprice">{{#t}}common.tsina{{/t}}</label>
                        <div class="col-5">
                              <input style="width: 100px" pattern="[0-9,\.\%]+" class="form-control" zippy="weditprice"/>
                          
                            
                        </div>
                    </div>
                     <div class="mb-2 row">
                        <label class="col-5 col-form-label" for="weditdescription">{{#t}}common.opys{{/t}}</label>
                        <div class="col-7">
                            <textarea style="height:100px" class="form-control" zippy="weditdescription"></textarea>
                        </div>
                    </div> 
                            
                    <div class="    mt-4   ">
                         <input zippy="weditcancel"   value="Скасувати" class="btn btn-secondary ms-4 "> 
                         <input   type="submit" value="{{#t}}common.zberehty{{/t}}" class="btn btn-primary  ">
                   </div>                            
               </form>   
            </div>
         </div>

          <div   zippy="wcatpan" class="row">                    
                      <div   zippy="wcatlist" class="col-12 col-sm-6 col-md-4  col-xl-3">
                            <div class="card mb-2" zippy="catbtn"  style="cursor:pointer" >

                                <table style="height:100%;width:100%;"  >
                                    <tr><td>
                                            <img zippy="catimage" style="height:100px "  >
                                        </td>
                                        <td valign="middle" align="left">

                                            <b   zippy="catname"> </b>
                                        </td></tr>
                                </table>  




                            </div>

                        </div >  
                        </div >  
          <div   zippy="wprodpan" class="row">
                          <div   zippy="wprodlist" class="col-12 col-sm-6 col-md-4  col-xl-3">
                            <div class="card mb-2" zippy="prodbtn" style="cursor:pointer;;">
                                <table style="height:100%;width:100%;"  >
                                    <tr><td rowspan="2">
                                            <img zippy="prodimage" style="height:100px "  >
                                        </td>
                                        <td   align="left">

                                            <b   zippy="prodname"> </b> 

                                        </td></tr>
                                    <tr><td><b zippy="prodprice" style="font-size:large"></b></td></tr>

                                </table>  



                            </div>

                        </div >        
                    </div >          
        
    </body>
</html>
