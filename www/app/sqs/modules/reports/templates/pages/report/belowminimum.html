<html>
    <head>
        <title>{{#t}}report.belowminimum.title{{/t}}</title>
    </head>
    <body>
        <style>
            /* SquirrelStock: первая колонка (наименование, получатель) остается на месте при прокрутке широкой таблицы — на телефоне */
            .sqs-sticky table tr > :first-child:not([colspan]) { position: sticky; left: 0; background: var(--bs-body-bg, #fff); z-index: 1; }
        </style>
        <div class="row">
            <div class="col-12">
                <h3>{{#t}}report.belowminimum.title{{/t}}</h3>
                <p class="text-muted">{{#t}}report.belowminimum.help{{/t}}</p>
                <div class="navbar">
                    <form zippy="filter">
                        <div class="row g-2 align-items-end">
                            <div class="col-auto">
                                <label class="form-label" for="store">{{#t}}common.sklad{{/t}}</label>
                                <select zippy="store" class="form-select"></select>
                            </div>
                            <div class="col-auto">
                                <label class="form-label" for="cat">{{#t}}common.katehoriia{{/t}}</label>
                                <select zippy="cat" class="form-select"></select>
                            </div>
                            <div class="col-auto">
                                <input zippy="onreport" class="btn btn-primary" type="submit" value="{{#t}}common.ok{{/t}}">
                            </div>
                        </div>
                    </form>
                </div>
                <div zippy="detail">
                    <div>
                        <a style="cursor:pointer" onclick=" $('#preview').printThis();" title="{{#t}}common.druk{{/t}}"><i class="fa fa-print me-2"></i></a>
                        <a href="/index.php?p=App/Pages/ShowReport&arg=xls/belowminimum" target="_blank" title="{{#t}}common.eksport_v_excel{{/t}}"><i class="fa fa-file-excel me-2"></i></a>
                    </div>
                    <div class="table-responsive mt-2 sqs-sticky" zippy="preview">
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
