<html>
    <head>
        <title>{{#t}}sqs.eqhist.title{{/t}}</title>
    </head>
    <body>
        <div class="row">
            <div class="col-12 col-xl-10">
                <h3>{{#t}}sqs.eqhist.title{{/t}}</h3>
                <p class="text-muted">{{#t}}sqs.eqhist.help{{/t}}</p>
                <form zippy="iform" enctype="multipart/form-data" class="col-12 col-md-8 col-xl-6">
                    <div class="mb-2">
                        <label class="form-label" for="census">{{#t}}sqs.eqhist.census_file{{/t}}</label>
                        <input type="file" zippy="census" class="form-control" accept=".xlsx">
                    </div>
                    <div class="mb-2">
                        <label class="form-label" for="journal">{{#t}}sqs.eqhist.journal_file{{/t}}</label>
                        <input type="file" zippy="journal" class="form-control" accept=".xlsx">
                    </div>
                    <div class="mb-2">
                        <label class="form-label" for="store">{{#t}}common.sklad{{/t}}</label>
                        <select zippy="store" class="form-select"></select>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" zippy="liftperiod">
                        <label class="form-check-label" for="liftperiod">{{#t}}sqs.eqhist.liftperiod{{/t}}</label>
                        <div class="form-text">{{#t}}sqs.eqhist.liftperiod_help{{/t}}</div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label" for="itemmap">{{#t}}sqs.eqhist.itemmap{{/t}}</label>
                        <textarea zippy="itemmap" class="form-control font-monospace" rows="6"></textarea>
                        <div class="form-text">{{#t}}sqs.eqhist.itemmap_help{{/t}}</div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label" for="fixes">{{#t}}sqs.eqhist.fixes{{/t}}</label>
                        <textarea zippy="fixes" class="form-control font-monospace" rows="6"></textarea>
                        <div class="form-text">{{#t}}sqs.eqhist.fixes_help{{/t}}</div>
                    </div>
                    <input zippy="check" type="submit" class="btn btn-outline-primary" value="{{#t}}sqs.eqhist.check{{/t}}">
                    <input zippy="write" type="submit" class="btn btn-primary" value="{{#t}}sqs.eqhist.write{{/t}}">
                    <input zippy="next" type="submit" class="btn btn-primary" value="{{#t}}sqs.eqhist.next{{/t}}">
                </form>
                <div class="mt-3" zippy="progress"></div>
                <div class="mt-3" zippy="report"></div>
            </div>
        </div>
    </body>
</html>
