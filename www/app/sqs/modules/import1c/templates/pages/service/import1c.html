<html>
    <head>
        <title>{{#t}}service.import1c.title{{/t}}</title>
    </head>
    <body>
        <div class="row">
            <div class="col-12 col-md-8 col-xl-6">
                <h3>{{#t}}service.import1c.title{{/t}}</h3>
                <p class="text-muted">{{#t}}service.import1c.help{{/t}}</p>
                <form zippy="iform" enctype="multipart/form-data">
                    <div class="mb-2">
                        <label class="form-label" for="filename">{{#t}}common.fail_importu{{/t}}</label>
                        <input type="file" zippy="filename" class="form-control" accept=".xls,.xlsx">
                    </div>
                    <div class="mb-2">
                        <label class="form-label" for="store">{{#t}}common.sklad{{/t}}</label>
                        <select zippy="store" class="form-select"></select>
                    </div>
                    <div class="mb-2">
                        <label class="form-label" for="date">{{#t}}service.import1c.receipt_date{{/t}}</label>
                        <input zippy="date" class="form-control" type="text">
                        <div class="form-text">{{#t}}service.import1c.receipt_date_help{{/t}}</div>
                    </div>
                    <div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" zippy="liftperiod">
                        <label class="form-check-label" for="liftperiod">{{#t}}service.import1c.liftperiod{{/t}}</label>
                    </div>
                    <div class="mb-2">
                        <label class="form-label" for="cat">{{#t}}service.import1c.new_items_cat{{/t}}</label>
                        <select zippy="cat" class="form-select"></select>
                    </div>
                    <input zippy="import" type="submit" class="btn btn-primary" value="{{#t}}common.importuvaty{{/t}}">
                </form>
                <div class="mt-3" zippy="report"></div>
            </div>
        </div>
    </body>
</html>
